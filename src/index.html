<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#047857" />
		<title>R2 Storage</title>
		<style>
			:root {
				--bg: #f1f5f9;
				--surface: #ffffff;
				--ink: #0f172a;
				--ink-80: #334155;
				--ink-60: #64748b;
				--line: #e2e8f0;
				--accent: #047857;
				--accent-soft: #ecfdf5;
				--danger: #dc2626;
				--danger-soft: #fef2f2;
				--r-sm: 8px;
				--r-md: 12px;
				--r-lg: 16px;
				--r-full: 999px;
				--sp-1: 4px;
				--sp-2: 8px;
				--sp-3: 12px;
				--sp-4: 16px;
				--sp-6: 24px;
				--sp-8: 32px;
				--tap: 44px;
			}
			* {
				box-sizing: border-box;
			}
			html {
				-webkit-text-size-adjust: 100%;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font:
					400 15px/1.5 -apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					'Helvetica Neue',
					Arial,
					'PingFang SC',
					'Microsoft YaHei',
					sans-serif;
			}
			body.locked {
				overflow: hidden;
			}
			button,
			input,
			a {
				font: inherit;
				color: inherit;
				-webkit-tap-highlight-color: transparent;
				touch-action: manipulation;
			}
			:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			/* 不要写成 `a` 或整个面板 */
			button,
			.crumb,
			.icon-btn,
			.sheet__item,
			.sheet__title {
				-webkit-touch-callout: none;
				-webkit-user-select: none;
				user-select: none;
			}
			/* 内联 SVG 图标统一尺寸与配色（fill 继承 currentColor） */
			.icon {
				display: block;
				width: 20px;
				height: 20px;
				flex: none;
				fill: currentColor;
			}
			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				margin: -1px;
				padding: 0;
				border: 0;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}

			.app {
				display: flex;
				flex-direction: column;
				min-height: 100dvh;
			}

			.app-bar {
				position: sticky;
				top: 0;
				z-index: 20;
				display: flex;
				align-items: center;
				gap: var(--sp-1);
				padding: calc(var(--sp-1) + env(safe-area-inset-top)) var(--sp-2) var(--sp-1) var(--sp-3);
				background: rgba(255, 255, 255, 0.92);
				-webkit-backdrop-filter: blur(8px);
				backdrop-filter: blur(8px);
				border-bottom: 1px solid var(--line);
			}
			.icon-btn {
				display: grid;
				place-items: center;
				width: var(--tap);
				height: var(--tap);
				flex: none;
				border: 0;
				border-radius: var(--r-sm);
				background: none;
				color: var(--ink-60);
				cursor: pointer;
			}
			.icon-btn:hover {
				background: var(--bg);
				color: var(--ink);
			}

			/* 开着「查看」时的状态：用强调色标出来，免得不知道自己在哪个模式 */
			.icon-btn--on {
				background: var(--accent-soft);
				color: var(--accent);
			}

			.crumbs {
				display: flex;
				align-items: center;
				gap: var(--sp-1);
				flex: 1;
				min-width: 0;
				overflow-x: auto;
				scrollbar-width: none;
				font-size: 15px;
				white-space: nowrap;
			}
			.crumbs::-webkit-scrollbar {
				display: none;
			}
			.crumb {
				display: inline-flex;
				align-items: center;
				min-height: var(--tap);
				padding: 0 var(--sp-2);
				border-radius: var(--r-sm);
				color: var(--ink-60);
				text-decoration: none;
			}
			.crumb:hover {
				background: var(--bg);
				color: var(--ink);
			}
			.crumb--current {
				color: var(--ink);
				font-weight: 600;
			}
			.crumb-sep {
				color: var(--ink-60);
			}

			.content {
				flex: 1;
				padding: var(--sp-2) var(--sp-3) calc(96px + env(safe-area-inset-bottom));
			}

			.list {
				list-style: none;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: var(--sp-2);
			}
			/* 不要给 .row 设 touch-action: none —— 会把列表滚动一起废掉 */
			.row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) var(--tap);
				align-items: center;
				gap: var(--sp-1);
				min-height: 64px;
				padding: var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-2);
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: var(--r-md);
				-webkit-touch-callout: none;
				-webkit-user-select: none;
				user-select: none;
			}
			.row:active {
				background: var(--bg);
			}
			.row--pressing {
				background: var(--bg);
			}
			.row__main {
				display: flex;
				align-items: center;
				gap: var(--sp-3);
				min-width: 0;
				min-height: var(--tap);
				padding: var(--sp-1) 0;
				border: 0;
				background: none;
				text-align: left;
				cursor: pointer;
			}
			/* 各类型的色调 */
			.row__icon {
				display: grid;
				place-items: center;
				flex: none;
				width: 40px;
				height: 40px;
				border-radius: var(--r-sm);
				background: var(--tone-soft, var(--bg));
				color: var(--tone, var(--ink-60));
			}
			.row__icon .icon {
				width: 22px;
				height: 22px;
			}
			.row__icon--folder {
				--tone: #047857;
				--tone-soft: #ecfdf5;
			}
			.row__icon--image {
				--tone: #1d4ed8;
				--tone-soft: #eff6ff;
			}
			.row__icon--video {
				--tone: #6d28d9;
				--tone-soft: #f5f3ff;
			}
			.row__icon--audio {
				--tone: #b45309;
				--tone-soft: #fffbeb;
			}
			.row__icon--markdown {
				--tone: #0e7490;
				--tone-soft: #ecfeff;
			}
			.row__icon--text {
				--tone: #334155;
				--tone-soft: #f1f5f9;
			}
			.row__icon--archive {
				--tone: #a16207;
				--tone-soft: #fefce8;
			}
			.row__icon--file {
				--tone: #94a3b8;
				--tone-soft: #f8fafc;
			}
			.row__text {
				min-width: 0;
			}
			.row__name {
				display: block;
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.row__meta {
				display: block;
				font-size: 13px;
				color: var(--ink-60);
			}

			.skeleton {
				height: 64px;
				border-radius: var(--r-md);
				background: var(--surface);
				border: 1px solid var(--line);
			}
			.state {
				padding: var(--sp-8) var(--sp-4);
				text-align: center;
				color: var(--ink-60);
			}
			.state__icon {
				display: grid;
				place-items: center;
				width: 48px;
				height: 48px;
				margin: 0 auto var(--sp-3);
				color: var(--ink-60);
			}
			.state__icon .icon {
				width: 40px;
				height: 40px;
			}
			.state__actions {
				display: flex;
				justify-content: center;
				padding-top: var(--sp-4);
			}
			.state--error {
				color: var(--danger);
			}
			.state--warn {
				color: #b45309;
			}

			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: var(--sp-2);
				min-height: var(--tap);
				padding: 0 var(--sp-4);
				border: 0;
				border-radius: var(--r-md);
				background: var(--accent);
				color: #fff;
				font-weight: 600;
				cursor: pointer;
			}
			.btn--ghost {
				background: var(--accent-soft);
				color: var(--accent);
			}
			.btn--danger {
				background: var(--danger);
			}
			.btn--muted {
				background: var(--bg);
				color: var(--ink-80);
			}
			.btn[disabled] {
				opacity: 0.5;
				cursor: default;
			}

			.fab {
				position: fixed;
				right: var(--sp-4);
				bottom: calc(var(--sp-4) + env(safe-area-inset-bottom));
				z-index: 30;
				display: inline-flex;
				align-items: center;
				gap: var(--sp-2);
				height: 56px;
				padding: 0 var(--sp-6) 0 var(--sp-4);
				border: 0;
				border-radius: var(--r-full);
				background: var(--accent);
				color: #fff;
				font-weight: 600;
				cursor: pointer;
				box-shadow: 0 8px 24px rgba(4, 120, 87, 0.32);
			}
			.fab:active {
				transform: scale(0.97);
			}

			.backdrop {
				position: fixed;
				inset: 0;
				z-index: 65; /* 高于预览层，便于在预览里触发删除确认 */
				background: rgba(15, 23, 42, 0.45);
				opacity: 0;
				visibility: hidden;
				transition: opacity 0.2s ease;
			}
			.backdrop.open {
				opacity: 1;
				visibility: visible;
			}

			.sheet {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				z-index: 66;
				max-height: 85dvh;
				overflow-y: auto;
				padding: var(--sp-3) var(--sp-3) calc(var(--sp-3) + env(safe-area-inset-bottom));
				background: var(--surface);
				border-radius: var(--r-lg) var(--r-lg) 0 0;
				transform: translateY(100%);
				transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1);
			}
			.sheet.open {
				transform: translateY(0);
			}
			.sheet__title {
				display: block;
				padding: var(--sp-2) var(--sp-3) var(--sp-4);
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.sheet__item {
				display: flex;
				align-items: center;
				gap: var(--sp-3);
				width: 100%;
				min-height: 52px;
				padding: var(--sp-3);
				border: 0;
				border-radius: var(--r-md);
				background: none;
				text-align: left;
				text-decoration: none;
				cursor: pointer;
			}
			.sheet__item:hover {
				background: var(--bg);
			}
			.sheet__item--danger {
				color: var(--danger);
			}
			.sheet__item--muted {
				color: var(--ink-60);
				justify-content: center;
			}
			.sheet__item .icon {
				color: var(--ink-60);
			}
			.sheet__item--danger .icon {
				color: var(--danger);
			}
			.sheet__item + .sheet__item {
				margin-top: var(--sp-2);
			}
			.sheet__item.sheet__item--muted {
				margin-top: var(--sp-3);
			}
			.sheet__actions {
				display: flex;
				gap: var(--sp-2);
				padding: var(--sp-3) 0 0;
			}
			.sheet__actions .btn {
				flex: 1;
			}
			.sheet__note {
				margin: 0;
				padding: 0 var(--sp-3) var(--sp-3);
				color: var(--danger);
				font-size: 14px;
			}
			.sheet--new-folder .editor__field {
				padding: 0 var(--sp-3);
			}
			.sheet--new-folder .editor__error {
				padding: var(--sp-2) var(--sp-3) 0;
			}
			/* 必须与 .sheet__rename-input 同高 */
			.sheet__title--edit {
				display: flex;
				align-items: center;
				height: 48px;
				width: 100%;
				padding: 0 var(--sp-3);
				border: 0;
				border-radius: var(--r-sm);
				background: none;
				text-align: left;
				cursor: text;
			}
			.sheet__title--edit:hover {
				background: var(--bg);
			}
			.sheet__rename-input {
				height: 48px; /* 同 .sheet__title--edit */
				width: 100%;
				padding: 0 var(--sp-3);
				border: 1px solid var(--line);
				border-radius: var(--r-md);
				background: var(--surface);
				color: var(--ink);
				font: inherit;
				font-weight: 600;
				font-size: 16px; /* ≥16px，避免 iOS 聚焦输入框时自动放大页面 */
			}
			/* 同 .editor__input:focus */
			.sheet__rename-input:focus {
				border-color: var(--accent);
				outline: none;
			}
			.sheet__rename-error {
				padding: var(--sp-2) var(--sp-3) 0;
			}
			.sheet__list {
				margin: 0;
				padding: 0 var(--sp-3) var(--sp-4);
				list-style: none;
				color: var(--ink-60);
				font-size: 14px;
			}
			.sheet__list li {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			/* 预览与编辑器共用的抽屉外壳 */
			.panel {
				position: fixed;
				inset: 0;
				z-index: 60;
				display: flex;
				flex-direction: column;
				height: 100dvh;
				background: var(--surface);
				transform: translateY(100%);
				visibility: hidden;
				transition:
					transform 0.26s ease,
					visibility 0s linear 0.26s;
			}
			.panel.open {
				transform: translateY(0);
				visibility: visible;
				transition:
					transform 0.26s ease,
					visibility 0s;
			}
			.viewer__bar {
				display: flex;
				align-items: center;
				gap: var(--sp-2);
				padding: calc(var(--sp-2) + env(safe-area-inset-top)) var(--sp-2) var(--sp-2) var(--sp-4);
				border-bottom: 1px solid var(--line);
			}
			.viewer__title {
				flex: 1;
				min-width: 0;
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.viewer__actions {
				display: flex;
				align-items: center;
				gap: var(--sp-2);
			}
			.panel__sep {
				width: 1px;
				height: 24px;
				background: var(--line);
				margin: 0 var(--sp-2);
				flex: none;
			}
			.icon-btn--danger {
				color: var(--danger);
			}
			.icon-btn--danger:hover {
				background: var(--danger-soft);
				color: var(--danger);
			}
			.icon-btn--primary {
				color: var(--accent);
			}
			.icon-btn--primary:hover {
				background: var(--accent-soft);
				color: var(--accent);
			}
			.icon-btn[disabled] {
				opacity: 0.5;
				cursor: default;
			}
			.viewer__body {
				flex: 1;
				min-height: 0;
				overflow: auto;
				overscroll-behavior: contain;
				padding: var(--sp-4);
			}
			.viewer--image .viewer__body,
			.viewer--video .viewer__body {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0;
			}
			.viewer--image img,
			.viewer--video video {
				width: 100%;
				height: 100%;
				max-width: 100%;
				max-height: 100%;
				object-fit: contain;
			}
			.viewer--audio .viewer__body {
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.viewer--audio audio {
				width: 100%;
			}

			.viewer__body pre.plain {
				margin: 0;
				white-space: pre-wrap;
				word-break: break-word;
				font:
					400 13px/1.6 ui-monospace,
					SFMono-Regular,
					Menlo,
					Consolas,
					monospace;
			}
			.md {
				max-width: 600px;
			}
			.md > :first-child {
				margin-top: 0;
			}
			.md h1 {
				font-size: 24px;
			}
			.md h2 {
				font-size: 18px;
			}
			.md h3 {
				font-size: 16px;
			}
			.md pre {
				background: var(--bg);
				padding: var(--sp-3);
				border-radius: var(--r-sm);
				overflow-x: auto;
			}
			.md code {
				background: var(--bg);
				padding: 2px 4px;
				border-radius: 4px;
				font:
					400 13px/1.5 ui-monospace,
					SFMono-Regular,
					Menlo,
					Consolas,
					monospace;
			}
			.md pre code {
				background: none;
				padding: 0;
			}
			.md blockquote {
				margin: 0 0 var(--sp-3);
				padding-left: var(--sp-3);
				border-left: 3px solid var(--line);
				color: var(--ink-80);
			}
			.md table {
				border-collapse: collapse;
			}
			.md th,
			.md td {
				border: 1px solid var(--line);
				padding: var(--sp-1) var(--sp-2);
			}
			.md img {
				max-width: 100%;
			}
			.md a {
				color: var(--accent);
			}

			/* 复用 .panel 外壳 */
			.editor {
				z-index: 67;
			}
			.editor__bar {
				display: flex;
				align-items: center;
				gap: var(--sp-2);
				padding: calc(var(--sp-2) + env(safe-area-inset-top)) var(--sp-2) var(--sp-2) var(--sp-4);
				border-bottom: 1px solid var(--line);
			}
			.editor__title {
				flex: 1;
				min-width: 0;
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.editor__dirty {
				flex: none;
				font-size: 12px;
				color: var(--ink-60);
				white-space: nowrap;
			}
			.editor__body {
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
				gap: var(--sp-2);
				overflow-y: auto;
				/*padding: var(--sp-4);*/
			}
			.editor__field {
				display: flex;
				flex-direction: column;
				gap: var(--sp-1);
			}
			.editor__label {
				font-size: 13px;
				color: var(--ink-60);
			}
			.editor__input,
			.editor__text {
				width: 100%;
				min-height: var(--tap);
				padding: var(--sp-3);
				border: 1px solid var(--line);
				border-radius: var(--r-md);
				background: var(--surface);
				color: var(--ink);
				font: inherit;
				font-size: 16px; /* ≥16px，避免 iOS 聚焦输入框时自动放大页面 */
			}
			.editor__input:focus,
			.editor__text:focus {
				border-color: var(--accent);
				outline: none;
			}
			.editor__text {
				flex: 1;
				min-height: 45dvh;
				resize: none;
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				line-height: 1.6;
			}

			/* 尺寸必须与 .editor__text 一致 */
			.editor__preview {
				flex: 1;
				min-height: 45dvh;
				padding: var(--sp-3);
				border: 1px solid var(--line);
				border-radius: var(--r-md);
				background: var(--surface);
				overflow-y: auto;
				overscroll-behavior: contain;
			}
			.editor__error,
			.editor__warn {
				margin: 0;
				font-size: 14px;
				color: var(--danger);
			}
			.editor__discard {
				display: flex;
				flex-direction: column;
				gap: var(--sp-1);
				padding: var(--sp-3);
				border: 1px solid var(--danger);
				border-radius: var(--r-md);
				background: var(--danger-soft);
			}
			.editor__discard > span {
				font-weight: 600;
			}

			.dropzone {
				position: fixed;
				inset: var(--sp-4);
				z-index: 70;
				display: grid;
				place-items: center;
				border: 2px dashed var(--accent);
				border-radius: var(--r-lg);
				background: rgba(236, 253, 245, 0.96);
				color: var(--accent);
				font-weight: 600;
				pointer-events: none;
			}

			/* 居中别用 transform：Alpine 过渡会写内联 transform 把它压掉 */
			.toast {
				position: fixed;
				left: 0;
				right: 0;
				margin: 0 auto;
				width: fit-content;
				bottom: calc(88px + env(safe-area-inset-bottom));
				z-index: 80;
				max-width: 90vw;
				display: flex;
				align-items: center;
				/* 三种形态必须同高：定高 30px，故取消按钮 ≤18px */
				gap: var(--sp-2);
				padding: 6px var(--sp-3);
				border-radius: var(--r-md);
				background: var(--ink);
				color: #fff;
				font-size: 12px;
				box-shadow: 0 8px 24px rgba(15, 23, 42, 0.24);
			}

			/* 进度态：宽度钉死 */
			.toast--progress {
				width: min(320px, 90vw);
			}
			/* 长文件名要截断，不能换行把盒子撑高 */
			.toast--progress .toast__text {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			/* 可点区域用 ::after 撑到 30px，且不外扩到提示条之外 */
			.toast__cancel {
				position: relative;
				flex: none;
				min-height: 18px;
				padding: 0 var(--sp-2);
				border: 0;
				border-radius: var(--r-sm);
				background: rgba(255, 255, 255, 0.16);
				color: #fff;
				font: inherit;
				cursor: pointer;
			}
			.toast__cancel::after {
				content: '';
				position: absolute;
				inset: -6px -4px;
			}

			.toast__cancel:hover {
				background: rgba(255, 255, 255, 0.28);
			}

			@media (min-width: 640px) {
				.content {
					max-width: 760px;
					margin: 0 auto;
					width: 100%;
				}
				.app-bar {
					padding-left: max(var(--sp-3), calc((100% - 760px) / 2));
					padding-right: max(var(--sp-2), calc((100% - 760px) / 2));
				}
				.sheet {
					left: 50%;
					right: auto;
					bottom: auto;
					top: 50%;
					width: min(420px, 92vw);
					border-radius: var(--r-lg);
					transform: translate(-50%, -46%) scale(0.98);
					transition:
						transform 0.18s ease,
						opacity 0.18s ease;
					opacity: 0;
				}
				.sheet.open {
					transform: translate(-50%, -50%) scale(1);
					opacity: 1;
				}
				.panel {
					inset: 0 0 0 auto;
					width: min(760px, 92vw);
					transform: translateX(100%);
					box-shadow: -8px 0 32px rgba(15, 23, 42, 0.16);
				}
				.panel.open {
					transform: translateX(0);
				}
			}
		</style>
	</head>

		<div
			class="app"
			x-data="browser()"
			x-init="init()"
			x-effect="document.body.classList.toggle('locked', !!(viewer.open || sheet || confirmTarget || newMenu || folder.open || editor.open || uploadConflicts))"
			@dragover.prevent="dragging = true"
			@dragleave="dragging = false"
			@drop.prevent="onDrop($event)"
		>
			<header class="app-bar">
				<h1 class="sr-only">R2 Storage</h1>
				<nav id="breadcrumbs" class="crumbs" aria-label="Breadcrumb path" x-ref="crumbs">
					<template x-for="(crumb, index) in crumbs" :key="crumb.href">
						<span class="crumbs__part">
							<span class="crumb-sep" x-show="index > 0">/</span>
							<a
								class="crumb"
								:class="{ 'crumb--current': index === crumbs.length - 1 }"
								:href="crumb.href"
								x-text="crumb.label"
							></a>
						</span>
					</template>
				</nav>
				<button
					id="refresh-button"
					class="icon-btn"
					@click="load()"
					:disabled="loading"
					title="刷新"
					aria-label="Refresh"
				>
					<svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
				</button>
			</header>

			<main class="content">
				<div x-show="loading" aria-hidden="true">
					<div class="list">
						<div class="skeleton"></div>
						<div class="skeleton"></div>
						<div class="skeleton"></div>
					</div>
				</div>

				<div class="state state--error" x-show="!loading && error">
					<span class="state__icon"
						><svg class="icon" aria-hidden="true"><use href="#i-warning"></use></svg
					></span>
					<p x-text="error"></p>
					<div class="state__actions">
						<button id="retry-button" class="btn btn--ghost" @click="load()" aria-label="Retry">重试</button>
					</div>
				</div>

				<div class="state state--warn" x-show="!loading && !error && truncated" role="status">
					<span class="state__icon"
						><svg class="icon" aria-hidden="true"><use href="#i-warning"></use></svg
					></span>
					<p>目录成员过多，只列出前 3000 项；未列出的内容请用更具体的路径访问。</p>
				</div>

				<div class="state" x-show="!loading && !error && entries.length === 0">
					<span class="state__icon"
						><svg class="icon" aria-hidden="true"><use href="#i-folder-open"></use></svg
					></span>
					<p>这个目录还是空的</p>
					<div class="state__actions">
						<button
							id="upload-first-button"
							class="btn btn--ghost"
							@click="pickerRef().click()"
							aria-label="Upload a file"
						>
							上传第一个文件
						</button>
					</div>
				</div>

				<ul id="entry-list" class="list" x-show="!loading && !error && entries.length > 0">
					<template x-for="(entry, index) in entries" :key="entry.href">
						<li
							class="row"
							:id="'entry-row-' + index"
							:class="{ 'row--pressing': pressAt && pressAt.name === entry.name }"
							:data-entry-name="entry.name"
							:data-entry-dir="entry.isDir ? 'true' : 'false'"
							@pointerdown="pressDown(entry, $event)"
							@pointermove="pressMove($event)"
							@pointerup="pressUp()"
							@pointercancel="pressUp()"
							@pointerleave="pressUp()"
							@click.capture="swallowPressClick($event)"
							@contextmenu.prevent="selectEntry(entry)"
						>
							<button
								class="row__main"
								:id="'entry-open-' + index"
								@click="open(entry)"
								:title="entry.name"
								:aria-label="'Open ' + entry.name"
							>
								<span class="row__icon" :class="'row__icon--' + iconFor(entry)"
									><svg class="icon" aria-hidden="true"><use :href="'#i-' + iconFor(entry)"></use></svg
								></span>
								<span class="row__text">
									<span class="row__name" x-text="entry.name"></span>
									<span class="row__meta" x-text="metaFor(entry)"></span>
								</span>
							</button>
							<button
								class="icon-btn row__more"
								:id="'entry-more-' + index"
								@click="selectEntry(entry)"
								:aria-label="'Actions for ' + entry.name"
							>
								<svg class="icon" aria-hidden="true"><use href="#i-more"></use></svg>
							</button>
						</li>
					</template>
				</ul>
			</main>

			<button id="new-button" class="fab" @click="openNewMenu()" aria-label="New">
				<svg class="icon" aria-hidden="true"><use href="#i-add"></use></svg><span>新建</span>
			</button>
			<input
				id="file-input"
				class="file-input"
				type="file"
				multiple
				x-ref="picker"
				@change="onPick($event)"
				aria-hidden="true"
				tabindex="-1"
				style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
			/>

			<div
				id="backdrop"
				class="backdrop"
				aria-hidden="true"
				:class="{ open: !!(sheet || confirmTarget || newMenu || folder.open || editor.open || uploadConflicts) }"
				@click="closeAllPanels()"
			></div>

			<template x-if="newMenu">
				<div id="new-menu-panel" class="sheet sheet--new open" role="dialog" aria-modal="true" aria-label="New">
					<span class="sheet__title">新建</span>
					<button
						id="new-upload-button"
						class="sheet__item"
						@click="newMenu = false; pickerRef().click()"
						aria-label="Upload files"
					>
						<svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg><span>上传文件</span>
					</button>
					<button id="new-folder-button" class="sheet__item" @click="openFolder()" aria-label="New folder">
						<svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg><span>新建目录</span>
					</button>
					<button id="new-text-button" class="sheet__item" @click="openEditor()" aria-label="New text file">
						<svg class="icon" aria-hidden="true"><use href="#i-note-add"></use></svg><span>新建文本文件</span>
					</button>
					<button
						id="new-cancel-button"
						class="sheet__item sheet__item--muted"
						@click="newMenu = false"
						aria-label="Cancel"
					>
						取消
					</button>
				</div>
			</template>

			<template x-if="folder.open">
				<div
					id="new-folder-panel"
					class="sheet sheet--new-folder open"
					role="dialog"
					aria-modal="true"
					aria-label="New folder"
				>
					<span class="sheet__title">新建目录</span>
					<label class="editor__field">
						<span class="editor__label">目录名</span>
						<input
							id="folder-name-input"
							class="editor__input"
							type="text"
							x-model="folder.name"
							@keydown.enter.prevent="createFolder()"
							aria-label="new Folder name"
							placeholder="new-folder"
							autocomplete="off"
							autocapitalize="off"
							spellcheck="false"
						/>
					</label>
					<p class="editor__error" x-show="folder.error" x-text="folder.error"></p>
					<div class="sheet__actions">
						<button
							id="folder-cancel-button"
							class="btn btn--muted"
							@click="folder.open = false"
							:disabled="folder.busy"
							aria-label="Cancel"
						>
							取消
						</button>
						<button
							id="folder-create-button"
							class="btn"
							@click="createFolder()"
							:disabled="folder.busy"
							x-text="folder.busy ? '创建中…' : '创建'"
							aria-label="Create folder"
						></button>
					</div>
				</div>
			</template>

			<template x-if="sheet">
				<div
					id="entry-actions-panel"
					class="sheet sheet--entry open"
					role="dialog"
					aria-modal="true"
					:aria-label="'Actions for ' + (sheet?.name ?? '')"
				>
					<!-- 每处 sheet.* 都要带 ?.：x-if 拆子树时 sheet 已是 null，表达式还会被求值一次 -->
					<button
						id="entry-title-button"
						class="sheet__title sheet__title--edit"
						type="button"
						x-show="!sheet?.isDir && !rename.active"
						@click="enterRename()"
						title="点击重命名"
						:aria-label="'Rename ' + (sheet?.name ?? '')"
					>
						<span x-text="sheet?.name ?? ''"></span>
					</button>
					<span class="sheet__title" x-show="sheet?.isDir" x-text="sheet?.name ?? ''"></span>
					<input
						id="rename-input"
						class="sheet__rename-input"
						type="text"
						x-show="rename.active"
						x-model="rename.draft"
						@keydown.enter.prevent="commitRename()"
						@keydown.escape.stop.prevent="cancelRename()"
						@blur="commitRename()"
						aria-label="New file name"
						autocomplete="off"
						autocapitalize="off"
						spellcheck="false"
					/>
					<p class="editor__error sheet__rename-error" x-show="rename.error" x-text="rename.error"></p>
					<button
						id="entry-preview-button"
						class="sheet__item"
						x-show="sheet?.kind"
						@click="preview(sheet)"
						aria-label="Preview"
					>
						<svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg><span>预览</span>
					</button>
					<button
						id="entry-edit-button"
						class="sheet__item"
						x-show="canEdit(sheet)"
						@click="editExisting(sheet)"
						aria-label="Edit"
					>
						<svg class="icon" aria-hidden="true"><use href="#i-edit"></use></svg><span>编辑</span>
					</button>
					<!-- 仅当服务端注入配置时出现（见 index.ts 的 ONLYOFFICE 接线） -->
					<button
						id="entry-onlyoffice-button"
						class="sheet__item"
						x-show="canOpenInOnlyOffice(sheet)"
						@click="openInOnlyOffice(sheet)"
						aria-label="Open in ONLYOFFICE"
					>
						<svg class="icon" aria-hidden="true"><use href="#i-external"></use></svg><span>用 ONLYOFFICE 打开</span>
					</button>
					<button
						id="entry-compress-button"
						class="sheet__item"
						x-show="canCompress(sheet)"
						@click="compressEntry(sheet)"

			<div

				class="panel editor"

						@click="toggleEditorPreview()"

						:aria-label="editor.preview ? 'Back to editing' : 'Preview'"
					>

				</div>
				<div class="editor__body">
					<label class="editor__field" x-show="!editor.href">
						<span class="editor__label">文件名</span>
						<input
							id="editor-name-input"
							class="editor__input"
							type="text"
							x-model="editor.name"
							@input="editor.conflict = false"
							aria-label="File name"
							placeholder="untitled.txt"
							autocomplete="off"
							autocapitalize="off"
							spellcheck="false"

					</label>
					<textarea
						id="editor-textarea"
						class="editor__text"
						x-show="!editor.preview"
						x-model="editor.text"

						aria-label="File content"
						placeholder="在这里输入内容…"
						@input="editor.dirty = true"
					></textarea>

						<div class="md" x-html="editor.html"></div>

					<p class="editor__warn" x-show="editor.conflict">同名文件已存在，再点一次保存会覆盖它。</p>
					<template x-if="editor.confirmDiscard">
						<div class="editor__discard">
							<span>有未保存的内容，确定放弃？</span>
							<div class="sheet__actions">
								<button
									id="editor-discard-cancel-button"
									class="btn btn--muted"
									@click="editor.confirmDiscard = false"
									aria-label="Keep editing"
								>
									继续编辑
								</button>
								<button
									id="editor-discard-confirm-button"
									class="btn btn--danger"
									@click="discardEditor()"
									aria-label="Discard"
								>

						</div>

			<div id="dropzone" class="dropzone" x-show="dragging" x-transition.opacity aria-label="Drop files to upload">
				松手即可上传到当前目录
			</div>
			<div
				id="toast"
				class="toast"
				x-show="toast"
				x-transition.opacity
				role="status"
				aria-live="polite"
				:class="{ 'toast--progress': toastProgress || !!archiveAbort }"
			>
				<span class="toast__text" x-text="toast"></span>
				<button
					id="archive-cancel-button"
					class="toast__cancel"
					x-show="archiveAbort"
					@click="cancelArchive()"
					aria-label="Cancel"
				>
					取消
				</button>
			</div>
		</div>

		<script>
			// 归档逻辑在 src/archive.client.js。

			// 与 src/ui.ts 的 MARKDOWN_EXTENSIONS 保持一致。
			const MARKDOWN_EXTENSIONS = ['md', 'markdown', 'mdown'];

			// 不要放进 $data：Alpine 会深度代理它。
			let markdown_renderer = null;

			// 长按判定：500ms，容差 10px。
			const LONG_PRESS_MS = 500;
			const LONG_PRESS_MOVE = 10;

			function markdown_to_html(text) {
				if (!markdown_renderer) {
					markdown_renderer = window.markdownit({ html: true, linkify: true, typographer: true, breaks: true });
				}
				return markdown_renderer.render(text);
			}

			/**
			 * 触感反馈。
			 *
			 * iOS Safari 没有 `navigator.vibrate`，所以调用处要有视觉替代；不支持就静默跳过。
			 * 时长 / 节奏区分轻重（轻点最短、完成两下、失败两下更重），不要全做一样长。
			 */
			const HAPTIC = { tap: 8, press: 16, done: [12, 40, 24], error: [28, 60, 28] };

			function buzz(kind) {
				try {
					if (typeof navigator.vibrate === 'function') navigator.vibrate(HAPTIC[kind] || HAPTIC.tap);
				} catch {
					// 个别 WebView 会直接抛，别让反馈失败影响主流程。
				}
			}

			window.browser = function () {
				return {
					entries: [],
					truncated: false,
					loading: true,
					error: '',
					busy: false,
					// 归档进行中的 AbortController；既挡重入，也决定提示条上是否出现「取消」。
					archiveAbort: null,
					// 长按手势状态：pressTimer 非空＝正在计时；pressFired＝这次长按已弹过面板。
					pressTimer: null,
					pressAt: null,
					pressFired: false,
					dragging: false,
					toast: '',
					// 进度态（定宽，见 .toast--progress）；复位只在提示条隐藏时做。
					toastProgress: false,
					sheet: null,
					// 服务端注入的编辑器配置（见 index.ts）；null = 不显示入口。
					onlyoffice: (window.__APP_CONFIG__ && window.__APP_CONFIG__.onlyoffice) || null,
					confirmTarget: null,
					uploadConflicts: null,
					newMenu: false,
					folder: { open: false, name: '', busy: false, error: '' },
					rename: { active: false, original: '', draft: '', error: '', pending: null },
					viewer: {
						open: false,
						entry: null,
						kind: '',
						title: '',
						href: '',
						status: 'loading',
						text: '',
						html: '',
						error: '',
					},
					editor: {
						open: false,
						href: '',
						name: '',
						text: '',
						contentType: null,
						dirty: false,
						conflict: false,
						busy: false,
						error: '',
						confirmDiscard: false,
						// 三者只在打开 / 关闭编辑器时重置，编辑 ⇄ 查看之间来回切不丢。
						preview: false,
						html: '',
						renderedFrom: '',
					},

					init() {
						this.load();
						this.scrollCrumbs();
						document.addEventListener('keydown', (event) => {
							if (event.key !== 'Escape') return;
							if (this.confirmTarget) this.confirmTarget = null;
							else if (this.uploadConflicts) this.uploadConflicts = null;
							else if (this.sheet) this.closeAllPanels();
							else if (this.folder.open) this.folder.open = false;
							else if (this.newMenu) this.newMenu = false;
							else if (this.editor.open) this.requestCloseEditor();
							else if (this.viewer.open) this.closeViewer();
						});
					},

					/** 弹出文件操作面板；kind 区分长按 / 轻点。 */
					selectEntry(entry, kind) {
						this.commitRename();
						this.sheet = entry;
						buzz(kind || 'tap');
					},

					/** 长按（触屏 / 触控笔）弹出文件操作面板。 */
					pressDown(entry, event) {
						// 鼠标不参与：桌面端的等价物是右键。
						if (event.pointerType === 'mouse') return;
						this.clearPressTimer();
						this.pressAt = { name: entry.name, x: event.clientX, y: event.clientY };
						// pointerdown 一定先于 click，每次按下都重置，避免残留标记吞掉后续点击。
						this.pressFired = false;
						this.pressTimer = setTimeout(() => {
							this.pressTimer = null;
							this.pressFired = true;
							this.selectEntry(entry, 'press');
						}, LONG_PRESS_MS);
					},

					/** 手指移动超过容差就取消长按（列表要能滑）。 */
					pressMove(event) {
						if (this.pressTimer === null || !this.pressAt) return;
						if (
							Math.abs(event.clientX - this.pressAt.x) > LONG_PRESS_MOVE ||
							Math.abs(event.clientY - this.pressAt.y) > LONG_PRESS_MOVE
						) {
							this.pressUp();
						}
					},

					pressUp() {
						this.clearPressTimer();
						this.pressAt = null;
					},

					clearPressTimer() {
						if (this.pressTimer !== null) {
							clearTimeout(this.pressTimer);
							this.pressTimer = null;
						}
					},

					/** 吃掉长按之后必然到来的那个 click，在捕获阶段拦。 */
					swallowPressClick(event) {
						if (!this.pressFired) return;
						this.pressFired = false;
						event.preventDefault();
						event.stopPropagation();
					},

					/** 每个关闭 / 切换面板的路径都显式提交改名（@blur 靠不住，见下）。 */
					closeAllPanels() {
						this.commitRename();
						this.sheet = null;
						this.confirmTarget = null;
						this.newMenu = false;
						this.folder.open = false;
						this.uploadConflicts = null;
					},

					async load() {
						this.loading = true;
						this.error = '';
						try {
							const response = await fetch(location.pathname + '?format=json', {
								credentials: 'include',
								headers: { Accept: 'application/json' },
							});
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							const data = await response.json();
							this.entries = data.entries;
							this.truncated = data.truncated === true;
						} catch (err) {
							this.error = '目录加载失败：' + err.message;
						} finally {
							this.loading = false;
						}
					},

					get crumbs() {
						const parts = decodeURIComponent(location.pathname).split('/').filter(Boolean);
						const trail = [{ label: '根目录', href: '/' }];
						let path = '';
						for (const part of parts) {
							path += '/' + part;
							trail.push({ label: part, href: path + '/' });
						}
						return trail;
					},

					/** 把面包屑滚到末尾。 */
					scrollCrumbs() {
						this.$nextTick(() => {
							const el = this.$refs.crumbs;
							if (el) el.scrollLeft = el.scrollWidth;
						});
					},

					iconFor(entry) {
						if (entry.isDir) return 'folder';
						if (entry.kind) return entry.kind;
						return /\.(zip|rar|7z|tar|gz|bz2|xz)$/i.test(entry.name) ? 'archive' : 'file';
					},

					metaFor(entry) {
						if (entry.isDir) return '目录';
						return this.formatSize(entry.size) + ' · ' + this.formatDate(entry.modified);
					},

					/** 只有文本类文件可在网页里编辑。 */
					canEdit(entry) {
						return !!entry && (entry.kind === 'text' || entry.kind === 'markdown');
					},

					/**
					 * 常见办公文档可用在线 ONLYOFFICE 打开。
					 *
					 * 扩展名清单由服务端给（adapter 放行的那份），前端不维护第二份。
					 */
					canOpenInOnlyOffice(entry) {
						if (!entry || entry.isDir || !this.onlyoffice) return false;
						const dot = entry.name.lastIndexOf('.');
						const extension = dot === -1 ? '' : entry.name.slice(dot + 1).toLowerCase();
						return this.onlyoffice.extensions.indexOf(extension) !== -1;
					},

					/**
					 * 用在线 ONLYOFFICE 打开：先要一份带签名短链的会话，再打开编辑器页面。
					 */
					async openInOnlyOffice(entry) {
						await this.settleRename();
						this.sheet = null;
						buzz('tap');
						try {
							// href 已编码，服务端会再解一次，这里必须先 decode。
							const query = new URLSearchParams({ path: decodeURIComponent(entry.href) });
							const response = await fetch('/onlyoffice/session?' + query, {
								credentials: 'include',
							});
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							const session = await response.json();
							const editor_query = new URLSearchParams({
								url: session.url,
								fileType: session.fileType,
								fileName: session.title,
							});
							const target = this.onlyoffice.editorUrl + '?' + editor_query;
							// 被弹窗拦截时（iOS Safari）退回当前页。
							if (!window.open(target, '_blank', 'noopener')) location.href = target;
						} catch (err) {
							this.notify('ONLYOFFICE 打开失败：' + err.message, 'error');
						}
					},

					formatSize(bytes) {
						const units = ['B', 'KB', 'MB', 'GB', 'TB'];
						let value = bytes;
						let unit = 0;
						while (value >= 1024 && unit < units.length - 1) {
							value = value / 1024;
							unit++;
						}
						return (unit === 0 ? value : value.toFixed(1)) + ' ' + units[unit];
					},

					formatDate(iso) {
						const date = new Date(iso);
						const pad = (n) => String(n).padStart(2, '0');
						return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
					},

					pickerRef() {
						return this.$refs.picker;
					},

					open(entry) {
						if (entry.isDir) {
							location.href = entry.href;
							return;
						}
						if (entry.kind) this.preview(entry);
						else location.href = entry.href;
					},

					/** 从预览层进入编辑（先关预览）。 */
					async editFromViewer() {
						const entry = this.viewer.entry;
						if (!entry) return;
						this.closeViewer();
						await this.editExisting(entry);
					},

					async preview(entry) {
						// 先等改名落盘，否则会去取旧路径。
						await this.settleRename();
						buzz('tap');
						this.sheet = null;
						this.viewer = {
							open: true,
							entry,
							kind: entry.kind,
							title: entry.name,
							href: entry.href,
							status: 'loading',
							text: '',
							html: '',
							error: '',
						};

						if (entry.kind !== 'text' && entry.kind !== 'markdown') {
							this.viewer.status = 'ready';
							return;
						}

						try {
							const response = await fetch(entry.href, { credentials: 'include' });
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							const text = await response.text();
							if (entry.kind === 'markdown') {
								await this.loadMarkdown();
								this.viewer.html = markdown_to_html(text);
								this.viewer.status = 'ready';
								// 等 HTML 进 DOM 再画 mermaid。
								await this.$nextTick();
								await this.renderMermaid(this.$refs.viewerBody);
							} else {
								this.viewer.text = text;
								this.viewer.status = 'ready';
							}
						} catch (err) {
							this.viewer.status = 'error';
							this.viewer.error = '预览失败：' + err.message;
						}
					},

					loadScript(src) {
						if (document.querySelector('script[src="' + src + '"]')) return Promise.resolve();
						return new Promise((resolve, reject) => {
							const script = document.createElement('script');
							script.src = src;
							script.onload = resolve;
							script.onerror = reject;
							document.head.appendChild(script);
						});
					},

					async loadMarkdown() {
						await this.loadScript('https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js');
						await this.loadScript('https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js');
					},

					// markdown-it 把 mermaid 渲染成 <pre><code>，先换成节点再绘制；root 是包含它的容器。
					async renderMermaid(root) {
						if (!window.mermaid || !root) return;
						root.querySelectorAll('code.language-mermaid').forEach((block) => {
							const container = document.createElement('div');
							container.className = 'mermaid';
							container.textContent = block.textContent;
							block.parentNode.replaceWith(container);
						});
						const nodes = root.querySelectorAll('.mermaid:not([data-processed])');
						if (nodes.length === 0) return;
						window.mermaid.initialize({ startOnLoad: false });
						await window.mermaid.run({ nodes });
					},

					closeViewer() {
						this.viewer.open = false;
						this.viewer.entry = null;
						this.viewer.href = '';
						this.viewer.html = '';
						this.viewer.text = '';
					},

					/** 新建文本文件时的默认名：在当前目录的条目里挑一个不冲突的（数据已在手上，无需额外请求）。 */
					default_new_name() {
						const taken = new Set(this.entries.map((entry) => entry.name));
						if (!taken.has('untitled.txt')) return 'untitled.txt';
						for (let index = 2; index < 1000; index++) {
							const candidate = 'untitled-' + index + '.txt';
							if (!taken.has(candidate)) return candidate;
						}
						return 'untitled.txt';
					},

					openNewMenu() {
						buzz('tap');
						this.newMenu = true;
					},

					openFolder() {
						buzz('tap');
						this.newMenu = false;
						this.sheet = null;
						this.folder = { open: true, name: this.default_folder_name(), busy: false, error: '' };
					},

					/** 同 default_new_name()；用英文是因为目录名会进 URL。 */
					default_folder_name() {
						const taken = new Set(this.entries.map((entry) => entry.name));
						if (!taken.has('new-folder')) return 'new-folder';
						for (let index = 2; index < 1000; index++) {
							const candidate = 'new-folder-' + index;
							if (!taken.has(candidate)) return candidate;
						}
						return 'new-folder';
					},

					/** MKCOL 建目录；405 / 409 如实报错。 */
					async createFolder() {
						const name = this.folder.name.trim();
						const invalid = this.check_name(name, '目录名');
						if (invalid) {
							this.folder.error = invalid;
							return;
						}

						this.folder.busy = true;
						this.folder.error = '';
						try {
							// 尾部斜杠是集合的规范写法。
							const response = await fetch(location.pathname + encodeURIComponent(name) + '/', {
								method: 'MKCOL',
								credentials: 'include',
							});
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							this.folder.open = false;
							this.notify('已创建目录 ' + name, 'done');
							await this.load();
						} catch (err) {
							this.folder.error = '创建失败：' + err.message;
							buzz('error');
						} finally {
							this.folder.busy = false;
						}
					},

					/** 点标题进入改名（仅文件）。 */
					enterRename() {
						if (!this.sheet || this.sheet.isDir) return;
						this.rename = { active: true, original: this.sheet.name, draft: this.sheet.name, error: '', pending: null };
						this.$nextTick(() => {
							const input = document.getElementById('rename-input');
							if (!input) return;
							input.focus();
							// 只选中主文件名，扩展名留着。
							const dot = this.rename.draft.lastIndexOf('.');
							input.setSelectionRange(0, dot > 0 ? dot : this.rename.draft.length);
						});
					},

					cancelRename() {
						this.rename = { active: false, original: '', draft: '', error: '', pending: null };
					},

					/** 提交改名（= 同目录 MOVE）；返回 pending Promise（无待提交时为 null）。 */
					commitRename() {
						if (!this.rename.active) return null;
						const name = this.rename.draft.trim();
						if (name === this.rename.original) {
							this.cancelRename();
							return null;
						}
						const invalid = this.check_name(name, '文件名');
						if (invalid) {
							// 非法名留在编辑态。
							this.rename.error = invalid;
							return null;
						}
						const entry = this.sheet;
						if (!entry) {
							this.cancelRename();
							return null;
						}
						// 先退出编辑态，避免同一个改名被重复提交。
						this.rename.active = false;
						this.rename.error = '';
						this.rename.pending = this.renameEntry(entry, name);
						return this.rename.pending;
					},

					/** 等挂起的改名落盘（读 href 前必须先过这一关）。 */
					async settleRename() {
						const pending = this.commitRename();
						if (pending) await pending;
					},

					async renameEntry(entry, name) {
						const old_href = entry.href;
						const new_href = location.pathname + encodeURIComponent(name);
						try {
							const response = await fetch(old_href, {
								method: 'MOVE',
								credentials: 'include',
								headers: {
									// Destination 必须是绝对 URL，host 要和请求完全一致，否则服务端回 502。
									Destination: location.origin + new_href,
									// 必须显式 F：MOVE 缺省 T 会先删掉同名目标（目标是目录时递归删光）。
									Overwrite: 'F',
								},
							});
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							this.applyRename(entry, old_href, name, new_href);
							this.notify('已重命名为 ' + name, 'done');
						} catch (err) {
							this.notify('重命名失败：' + err.message, 'error');
						} finally {
							this.rename.pending = null;
						}
						await this.load();
					},

					/** 改名成功后就地更新 sheet / viewer / editor 持有的引用。 */
					applyRename(entry, old_href, name, new_href) {
						entry.name = name;
						entry.href = new_href; // entry 就是 this.sheet，标题与动作随之更新
						if (this.viewer.entry === entry) {
							this.viewer.title = name;
							this.viewer.href = new_href;
						}
						if (this.editor.href === old_href) {
							this.editor.href = new_href;
							this.editor.name = name;
						}
					},

					/** 下载（目录则打包）。 */
					async downloadEntry(entry, event) {
						event.preventDefault();
						await this.settleRename();
						if (entry.isDir) return this.zipFolder(entry);
						buzz('tap');
						const link = document.createElement('a');
						link.href = entry.href;
						link.download = entry.name;
						document.body.appendChild(link);
						link.click();
						link.remove();
					},

					/** 目录打包下载（实现在 src/archive.client.js）。 */
					async zipFolder(entry) {
						await this.runArchive('压缩', async (signal, onProgress) => {
							const result = await window.R2Archive.downloadFolderAsZip(entry, { onProgress, signal });
							this.notify('已压缩 ' + result.files + ' 个文件', 'done');
						});
					},

					/** 只有 zip 能解压。 */
					canExtract(entry) {
						return !!entry && !entry.isDir && /\.zip$/i.test(entry.name);
					},

					canCompress(entry) {
						return !!entry && entry.isDir;
					},

					/** 在当前目录生成真实的 <目录名>.zip 对象，不下载。 */
					async compressEntry(entry) {
						await this.settleRename();
						this.sheet = null;
						await this.runArchive('压缩', async (signal, onProgress) => {
							const result = await window.R2Archive.storeFolderAsZip(entry, { onProgress, signal });
							this.notify('已生成 ' + entry.name + '.zip（' + this.formatSize(result.bytes) + '）', 'done');
							await this.load();
						});
					},

					/** 解压到同名目录（实现在 src/archive.client.js）。 */
					async extractEntry(entry) {
						await this.settleRename();
						this.sheet = null;
						await this.runArchive('解压', async (signal, onProgress) => {
							const result = await window.R2Archive.extractZipToFolder(entry, { onProgress, signal });
							this.notify('已解压 ' + result.files + ' 个文件到 ' + entry.name.replace(/\.zip$/i, '') + '/', 'done');
							await this.load();
						});
					},

					/** 压缩 / 解压的公共外壳：挡重入、把进度接到提示条、结束收掉 AbortController。 */
					async runArchive(label, task) {
						if (this.archiveAbort) return;
						const controller = new AbortController();
						this.archiveAbort = controller;
						buzz('tap');
						try {
							await task(controller.signal, (text) => this.notifySticky(text));
						} catch (err) {
							// 取消不算失败，原样转出模块的说明。
							this.notify(
								controller.signal.aborted ? err.message : label + '失败：' + err.message,
								controller.signal.aborted ? 'tap' : 'error',
							);
						} finally {
							this.archiveAbort = null;
						}
					},

					cancelArchive() {
						if (this.archiveAbort) this.archiveAbort.abort();
					},

					check_name(name, label) {
						if (!name) return '请填写' + label;
						if (name.includes('/') || name.includes('\\')) return label + '不能包含斜杠';
						return '';
					},

					openEditor(entry) {
						buzz('tap');
						this.newMenu = false;
						this.sheet = null;
						this.editor = {
							open: true,
							href: entry ? entry.href : '',
							name: entry ? entry.name : this.default_new_name(),
							text: entry ? entry.text : '',
							// 沿用原 Content-Type，不要顺手改掉元数据。
							contentType: (entry && entry.contentType) || null,
							dirty: false,
							conflict: false,
							busy: false,
							error: '',
							confirmDiscard: false,
							preview: false,
							html: '',
							renderedFrom: '',
						};
					},

					async editExisting(entry) {
						await this.settleRename();
						this.sheet = null;
						try {
							const response = await fetch(entry.href, { credentials: 'include' });
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							this.openEditor({
								href: entry.href,
								name: entry.name,
								text: await response.text(),
								contentType: entry.contentType,
							});
						} catch (err) {
							this.notify('打开失败：' + err.message, 'error');
						}
					},

					requestCloseEditor() {
						// 有未保存内容先确认一次。
						if (this.editor.confirmDiscard) return this.discardEditor();
						if (this.editor.dirty && this.editor.text) this.editor.confirmDiscard = true;
						else this.discardEditor();
					},

					discardEditor() {
						this.editor.open = false;
						this.editor.confirmDiscard = false;
						this.editor.text = '';
						this.editor.dirty = false;
						this.editor.conflict = false;
						// 只有真正关掉编辑器才丢掉已渲染内容（编辑 ⇄ 查看之间不丢）。
						this.editor.preview = false;
						this.editor.html = '';
						this.editor.renderedFrom = '';
					},

					/** 「查看」只对 markdown 有意义。 */
					canPreviewEditor() {
						const name = this.editor.name || '';
						const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
						return MARKDOWN_EXTENSIONS.includes(ext);
					},

					async toggleEditorPreview() {
						if (this.editor.preview) {
							this.editor.preview = false;
							return;
						}
						// mermaid 需要节点先进布局。
						this.editor.preview = true;
						this.editor.error = '';
						try {
							await this.loadMarkdown();
							// 内容没变不重渲染。
							if (this.editor.renderedFrom !== this.editor.text) {
								this.editor.html = markdown_to_html(this.editor.text);
								this.editor.renderedFrom = this.editor.text;
							}
							await this.$nextTick();
							await this.renderMermaid(this.$refs.editorPreview);
						} catch (err) {
							// 出错退回编辑态，否则提示会显示在看不见的地方。
							this.editor.preview = false;
							this.editor.error = '预览失败：' + err.message;
						}
					},

					async saveEditor() {
						const raw = this.editor.name.trim();
						const invalid = this.check_name(raw, '文件名');
						if (invalid) {
							this.editor.error = invalid;
							return;
						}
						// 没写扩展名时补 .txt。
						const name = raw.includes('.') ? raw : raw + '.txt';
						const href = this.editor.href || location.pathname + encodeURIComponent(name);

						this.editor.busy = true;
						this.editor.error = '';
						try {
							// 新建时先探重名；conflict 在文件名变化时被重置（见 @input）。
							if (!this.editor.href && !this.editor.conflict) {
								const probe = await fetch(href, { method: 'HEAD', credentials: 'include' });
								if (probe.ok) {
									this.editor.conflict = true;
									this.editor.name = name;
									return;
								}
							}
							const response = await fetch(href, {
								method: 'PUT',
								body: this.editor.text,
								credentials: 'include',
								headers: { 'Content-Type': this.editor.contentType || 'text/plain; charset=utf-8' },
							});
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							this.discardEditor();
							this.notify('已保存 ' + name, 'done');
							await this.load();
						} catch (err) {
							this.editor.error = '保存失败：' + err.message;
							buzz('error');
						} finally {
							this.editor.busy = false;
						}
					},

					async copyLink(entry) {
						if (!entry) return;
						await this.settleRename();
						const url = location.origin + entry.href;
						this.sheet = null;
						try {
							await navigator.clipboard.writeText(url);
							this.notify('链接已复制', 'tap');
						} catch {
							this.notify(url);
						}
					},

					askDelete(entry) {
						if (!entry) return;
						buzz('tap');
						this.sheet = null;
						this.confirmTarget = entry;
					},

					async remove() {
						const target = this.confirmTarget;
						this.busy = true;
						try {
							const response = await fetch(target.href, { method: 'DELETE', credentials: 'include' });
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							this.confirmTarget = null;
							// 删的正好是当前预览的文件时，一并关掉预览层。
							if (this.viewer.entry && this.viewer.entry.href === target.href) this.closeViewer();
							this.notify('已删除 ' + target.name, 'done');
							await this.load();
						} catch (err) {
							this.notify('删除失败：' + err.message, 'error');
						} finally {
							this.busy = false;
						}
					},

					onPick(event) {
						const files = Array.from(event.target.files || []);
						event.target.value = '';
						this.upload(files);
					},

					onDrop(event) {
						this.dragging = false;
						this.upload(Array.from(event.dataTransfer.files || []));
					},

					async upload(files, options) {
						if (files.length === 0) return;
						// 批量上传先进定宽态。
						if (files.length > 1) this.toastProgress = true;
						// 默认不允许覆盖：交给服务端用 If-None-Match 原子判定，避免探测与写入之间的竞态。
						const overwrite = !!(options && options.overwrite);
						this.busy = true;
						const conflicts = [];
						let done = 0;
						for (const file of files) {
							this.notify('上传中 ' + (done + conflicts.length + 1) + '/' + files.length + '：' + file.name);
							try {
								const response = await fetch(location.pathname + encodeURIComponent(file.name), {
									method: 'PUT',
									body: file,
									credentials: 'include',
									headers: overwrite ? undefined : { 'If-None-Match': '*' },
								});
								if (!overwrite && response.status === 412) {
									conflicts.push(file);
									continue;
								}
								if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
								done++;
							} catch (err) {
								this.busy = false;
								this.notify('上传失败 ' + file.name + '：' + err.message, 'error');
								await this.load();
								return;
							}
						}
						this.busy = false;

						// 同名目录直接跳过（标记对象被文件顶掉后，目录里的内容会不可见）。
						//
						// 列表可能过期，列表里没有的再向服务器确认一次。
						const dirNames = new Set(this.entries.filter((entry) => entry.isDir).map((entry) => entry.name));
						const blocked = [];
						const pending = [];
						for (const file of conflicts) {
							if (dirNames.has(file.name)) {
								blocked.push(file);
								continue;
							}
							let isDir = false;
							try {
								const probe = await fetch(location.pathname + encodeURIComponent(file.name), {
									method: 'PROPFIND',
									credentials: 'include',
									headers: { Depth: '0', 'Content-Type': 'application/xml' },
									body: '<?xml version="1.0"?><propfind xmlns="DAV:"><prop><resourcetype/></prop></propfind>',
								});
								isDir = probe.ok && (await probe.text()).includes('<collection />');
							} catch {
								// 探测失败当作文件处理。
							}
							(isDir ? blocked : pending).push(file);
						}

						if (pending.length > 0) {
							this.uploadConflicts = pending;
							buzz('tap');
							if (done > 0) this.notify('已上传 ' + done + ' 个文件', 'done');
							await this.load();
							return;
						}

						// 只留一条提示：toast 只有一个槽位。
						const parts = [];
						if (done > 0) parts.push('已上传 ' + done + ' 个文件');
						if (blocked.length > 0) parts.push('跳过同名目录：' + blocked.map((file) => file.name).join('、'));
						this.notify(parts.length > 0 ? parts.join('；') : '没有文件被上传', parts.length > 0 ? 'done' : 'error');
						await this.load();
					},

					async confirmOverwriteUpload() {
						const files = this.uploadConflicts || [];
						this.uploadConflicts = null;
						await this.upload(files, { overwrite: true });
					},

					/** 常驻提示：给长操作推进度（不用 notify()，它会 2.4s 后自动消失）。 */
					notifySticky(message) {
						clearTimeout(this.toastTimer);
						this.toastProgress = true;
						this.toast = message;
					},

					notify(message, kind) {
						if (kind) buzz(kind);
						this.toast = message;
						clearTimeout(this.toastTimer);
						this.toastTimer = setTimeout(() => {
							this.toast = '';
							// 隐藏后再退出定宽态（可见时改宽度会跳）。
							this.toastProgress = false;
						}, 2400);
					},
				};
			};
		</script>
		<script defer src="/_app/archive.client.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
	</body>
</html>
