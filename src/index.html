<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#047857" />
		<title>R2 Storage</title>
		<style>
			:root {
				--bg: #f1f5f9;
				--surface: #ffffff;
				--ink: #0f172a;
				--ink-80: #334155;
				--ink-60: #64748b;
				--line: #e2e8f0;
				--accent: #047857;
				--accent-soft: #ecfdf5;
				--danger: #dc2626;
				--danger-soft: #fef2f2;
				--r-sm: 8px;
				--r-md: 12px;
				--r-lg: 16px;
				--r-full: 999px;
				--sp-1: 4px;
				--sp-2: 8px;
				--sp-3: 12px;
				--sp-4: 16px;
				--sp-6: 24px;
				--sp-8: 32px;
				--tap: 44px;
			}
			* {
				box-sizing: border-box;
			}
			html {
				-webkit-text-size-adjust: 100%;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font:
					400 15px/1.5 -apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					'Helvetica Neue',
					Arial,
					'PingFang SC',
					'Microsoft YaHei',
					sans-serif;
			}
			body.locked {
				overflow: hidden;
			}
			/* 移动端：去掉 300ms 双击缩放延迟与点击高亮 */
			button,
			input,
			a {
				font: inherit;
				color: inherit;
				-webkit-tap-highlight-color: transparent;
				touch-action: manipulation;
			}
			:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			/* 内联 SVG 图标统一尺寸与配色（fill 继承 currentColor） */
			.icon {
				display: block;
				width: 20px;
				height: 20px;
				flex: none;
				fill: currentColor;
			}
			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				margin: -1px;
				padding: 0;
				border: 0;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}

			.app {
				display: flex;
				flex-direction: column;
				min-height: 100dvh;
			}

			/* 顶栏：面包屑就是标题（52px 一行），不再单独占一行静态应用名 */
			.app-bar {
				position: sticky;
				top: 0;
				z-index: 20;
				display: flex;
				align-items: center;
				gap: var(--sp-1);
				padding: calc(var(--sp-1) + env(safe-area-inset-top)) var(--sp-2) var(--sp-1) var(--sp-3);
				background: rgba(255, 255, 255, 0.92);
				-webkit-backdrop-filter: blur(8px);
				backdrop-filter: blur(8px);
				border-bottom: 1px solid var(--line);
			}
			.icon-btn {
				display: grid;
				place-items: center;
				width: var(--tap);
				height: var(--tap);
				flex: none;
				border: 0;
				border-radius: var(--r-sm);
				background: none;
				color: var(--ink-60);
				cursor: pointer;
			}
			.icon-btn:hover {
				background: var(--bg);
				color: var(--ink);
			}

			/* 开着「查看」时的状态：用强调色标出来，免得不知道自己在哪个模式 */
			.icon-btn--on {
				background: var(--accent-soft);
				color: var(--accent);
			}

			.crumbs {
				display: flex;
				align-items: center;
				gap: var(--sp-1);
				flex: 1;
				min-width: 0;
				overflow-x: auto;
				scrollbar-width: none;
				font-size: 15px;
				white-space: nowrap;
			}
			.crumbs::-webkit-scrollbar {
				display: none;
			}
			.crumb {
				display: inline-flex;
				align-items: center;
				min-height: var(--tap);
				padding: 0 var(--sp-2);
				border-radius: var(--r-sm);
				color: var(--ink-60);
				text-decoration: none;
			}
			.crumb:hover {
				background: var(--bg);
				color: var(--ink);
			}
			.crumb--current {
				color: var(--ink);
				font-weight: 600;
			}
			.crumb-sep {
				color: var(--ink-60);
			}

			.content {
				flex: 1;
				padding: var(--sp-2) var(--sp-3) calc(96px + env(safe-area-inset-bottom));
			}

			.list {
				list-style: none;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: var(--sp-2);
			}
			/*
			 * 长按行 = 弹出文件操作面板（等价于行尾的 ⋯）。
			 * 必须先压掉 iOS 的原生行为，否则长按会弹出系统的「拷贝 / 查询」菜单，跟我们的面板打架：
			 *   -webkit-touch-callout: none   禁止长按弹系统菜单
			 *   -webkit-user-select: none     禁止长按选中文字
			 * 注意**不要**碰 touch-action —— 设成 none 会把列表滚动一起废掉。
			 */
			.row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) var(--tap);
				align-items: center;
				gap: var(--sp-1);
				min-height: 64px;
				padding: var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-2);
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: var(--r-md);
				-webkit-touch-callout: none;
				-webkit-user-select: none;
				user-select: none;
			}
			.row:active {
				background: var(--bg);
			}
			/*
			 * 长按中的反馈。iOS 上 navigator.vibrate 不可用，给不了 3D Touch 那种触感，
			 * 就只能靠底色变化：否则按住这 500ms 界面毫无反应，用户会以为手势没生效。
			 */
			.row--pressing {
				background: var(--bg);
			}
			.row__main {
				display: flex;
				align-items: center;
				gap: var(--sp-3);
				min-width: 0;
				min-height: var(--tap);
				padding: var(--sp-1) 0;
				border: 0;
				background: none;
				text-align: left;
				cursor: pointer;
			}
			/* 按类型给出色调，便于一眼区分目录/图片/媒体/文本/不可预览 */
			.row__icon {
				display: grid;
				place-items: center;
				flex: none;
				width: 40px;
				height: 40px;
				border-radius: var(--r-sm);
				background: var(--tone-soft, var(--bg));
				color: var(--tone, var(--ink-60));
			}
			.row__icon .icon {
				width: 22px;
				height: 22px;
			}
			.row__icon--folder {
				--tone: #047857;
				--tone-soft: #ecfdf5;
			}
			.row__icon--image {
				--tone: #1d4ed8;
				--tone-soft: #eff6ff;
			}
			.row__icon--video {
				--tone: #6d28d9;
				--tone-soft: #f5f3ff;
			}
			.row__icon--audio {
				--tone: #b45309;
				--tone-soft: #fffbeb;
			}
			.row__icon--markdown {
				--tone: #0e7490;
				--tone-soft: #ecfeff;
			}
			.row__icon--text {
				--tone: #334155;
				--tone-soft: #f1f5f9;
			}
			.row__icon--archive {
				--tone: #a16207;
				--tone-soft: #fefce8;
			}
			.row__icon--file {
				--tone: #94a3b8;
				--tone-soft: #f8fafc;
			}
			.row__text {
				min-width: 0;
			}
			.row__name {
				display: block;
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.row__meta {
				display: block;
				font-size: 13px;
				color: var(--ink-60);
			}

			.skeleton {
				height: 64px;
				border-radius: var(--r-md);
				background: var(--surface);
				border: 1px solid var(--line);
			}
			.state {
				padding: var(--sp-8) var(--sp-4);
				text-align: center;
				color: var(--ink-60);
			}
			.state__icon {
				display: grid;
				place-items: center;
				width: 48px;
				height: 48px;
				margin: 0 auto var(--sp-3);
				color: var(--ink-60);
			}
			.state__icon .icon {
				width: 40px;
				height: 40px;
			}
			.state__actions {
				display: flex;
				justify-content: center;
				padding-top: var(--sp-4);
			}
			.state--error {
				color: var(--danger);
			}
			.state--warn {
				color: #b45309;
			}

			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: var(--sp-2);
				min-height: var(--tap);
				padding: 0 var(--sp-4);
				border: 0;
				border-radius: var(--r-md);
				background: var(--accent);
				color: #fff;
				font-weight: 600;
				cursor: pointer;
			}
			.btn--ghost {
				background: var(--accent-soft);
				color: var(--accent);
			}
			.btn--danger {
				background: var(--danger);
			}
			.btn--muted {
				background: var(--bg);
				color: var(--ink-80);
			}
			.btn[disabled] {
				opacity: 0.5;
				cursor: default;
			}

			.fab {
				position: fixed;
				right: var(--sp-4);
				bottom: calc(var(--sp-4) + env(safe-area-inset-bottom));
				z-index: 30;
				display: inline-flex;
				align-items: center;
				gap: var(--sp-2);
				height: 56px;
				padding: 0 var(--sp-6) 0 var(--sp-4);
				border: 0;
				border-radius: var(--r-full);
				background: var(--accent);
				color: #fff;
				font-weight: 600;
				cursor: pointer;
				box-shadow: 0 8px 24px rgba(4, 120, 87, 0.32);
			}
			.fab:active {
				transform: scale(0.97);
			}

			.backdrop {
				position: fixed;
				inset: 0;
				z-index: 65; /* 高于预览层，便于在预览里触发删除确认 */
				background: rgba(15, 23, 42, 0.45);
				opacity: 0;
				visibility: hidden;
				transition: opacity 0.2s ease;
			}
			.backdrop.open {
				opacity: 1;
				visibility: visible;
			}

			.sheet {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				z-index: 66;
				max-height: 85dvh;
				overflow-y: auto;
				padding: var(--sp-3) var(--sp-3) calc(var(--sp-3) + env(safe-area-inset-bottom));
				background: var(--surface);
				border-radius: var(--r-lg) var(--r-lg) 0 0;
				transform: translateY(100%);
				transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1);
			}
			.sheet.open {
				transform: translateY(0);
			}
			.sheet__title {
				display: block;
				padding: var(--sp-2) var(--sp-3) var(--sp-4);
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.sheet__item {
				display: flex;
				align-items: center;
				gap: var(--sp-3);
				width: 100%;
				min-height: 52px;
				padding: var(--sp-3);
				border: 0;
				border-radius: var(--r-md);
				background: none;
				text-align: left;
				text-decoration: none;
				cursor: pointer;
			}
			.sheet__item:hover {
				background: var(--bg);
			}
			.sheet__item--danger {
				color: var(--danger);
			}
			.sheet__item--muted {
				color: var(--ink-60);
				justify-content: center;
			}
			.sheet__item .icon {
				color: var(--ink-60);
			}
			.sheet__item--danger .icon {
				color: var(--danger);
			}
			/* 相邻可点目标至少留 8px，避免指腹滓到下一项 */
			.sheet__item + .sheet__item {
				margin-top: var(--sp-2);
			}
			/* 取消（退出类）与上面的操作拉开距离，避免想点取消却点到别的 */
			.sheet__item.sheet__item--muted {
				margin-top: var(--sp-3);
			}
			.sheet__actions {
				display: flex;
				gap: var(--sp-2);
				padding: var(--sp-3) 0 0;
			}
			.sheet__actions .btn {
				flex: 1;
			}
			.sheet__note {
				margin: 0;
				padding: 0 var(--sp-3) var(--sp-3);
				color: var(--danger);
				font-size: 14px;
			}
			/* 新建目录面板：标题自带 --sp-3 内缩，输入框与错误行跟着对齐 */
			.sheet--new-folder .editor__field {
				padding: 0 var(--sp-3);
			}
			.sheet--new-folder .editor__error {
				padding: var(--sp-2) var(--sp-3) 0;
			}
			/*
				标题即改名入口：不新增按钮，靠标题本身承载（面板宽 366px，比预览栏的 133px 宽得多）。

				它和下面的 .sheet__rename-input 必须**高度完全一致**：面板是底部吸附的
				（left/right/bottom = 0），内容一旦变高，整块面板就往上跳。
				输入框原来是 50px、标题 47px，切到编辑态时会看到面板硬跳 3px。
			*/
			.sheet__title--edit {
				display: flex;
				align-items: center;
				height: 48px;
				width: 100%;
				padding: 0 var(--sp-3);
				border: 0;
				border-radius: var(--r-sm);
				background: none;
				text-align: left;
				cursor: text;
			}
			.sheet__title--edit:hover {
				background: var(--bg);
			}
			.sheet__rename-input {
				height: 48px; /* 与 .sheet__title--edit 一致，否则面板会跳 */
				width: 100%;
				padding: 0 var(--sp-3);
				border: 1px solid var(--line);
				border-radius: var(--r-md);
				background: var(--surface);
				color: var(--ink);
				font: inherit;
				font-weight: 600;
				font-size: 16px; /* ≥16px，避免 iOS 聚焦输入框时自动放大页面 */
			}
			/*
				聚焦只靠边框变色表示，**不开 outline**。
				否则会与上面的 border 叠成两圈：全局 :focus-visible 是
				`outline: 2px solid var(--accent); outline-offset: 2px`，
				和 accent 色的 border 一起就是「边框 + 分离的一圈」，看着像画了两层。
				项目里 .editor__input:focus 就是这个约定，这里保持一致。
			*/
			.sheet__rename-input:focus {
				border-color: var(--accent);
				outline: none;
			}
			.sheet__rename-error {
				padding: var(--sp-2) var(--sp-3) 0;
			}
			.sheet__list {
				margin: 0;
				padding: 0 var(--sp-3) var(--sp-4);
				list-style: none;
				color: var(--ink-60);
				font-size: 14px;
			}
			.sheet__list li {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			/* 预览层与编辑器共用的抽屉外壳：移动端全屏、桌面端右侧停靠 */
			.panel {
				position: fixed;
				inset: 0;
				z-index: 60;
				display: flex;
				flex-direction: column;
				height: 100dvh;
				background: var(--surface);
				transform: translateY(100%);
				visibility: hidden;
				transition:
					transform 0.26s ease,
					visibility 0s linear 0.26s;
			}
			.panel.open {
				transform: translateY(0);
				visibility: visible;
				transition:
					transform 0.26s ease,
					visibility 0s;
			}
			.viewer__bar {
				display: flex;
				align-items: center;
				gap: var(--sp-2);
				padding: calc(var(--sp-2) + env(safe-area-inset-top)) var(--sp-2) var(--sp-2) var(--sp-4);
				border-bottom: 1px solid var(--line);
			}
			.viewer__title {
				flex: 1;
				min-width: 0;
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			/* 防误触：关闭固定在最右，往左依次是下载、复制链接（中间隔一条分隔线），再往左是「编辑」。
	   「编辑」只在文本类文件上出现，位置就在原来删除的位置。删除已从预览栏移除 ——
	   它现在只出现在列表的「更多」菜单里，不再和关闭按钮同屏，想误触也碰不到。
	   相邻 44px 目标之间留 8px。 */
			.viewer__actions {
				display: flex;
				align-items: center;
				gap: var(--sp-2);
			}
			.panel__sep {
				width: 1px;
				height: 24px;
				background: var(--line);
				margin: 0 var(--sp-2);
				flex: none;
			}
			.icon-btn--danger {
				color: var(--danger);
			}
			.icon-btn--danger:hover {
				background: var(--danger-soft);
				color: var(--danger);
			}
			.icon-btn--primary {
				color: var(--accent);
			}
			.icon-btn--primary:hover {
				background: var(--accent-soft);
				color: var(--accent);
			}
			.icon-btn[disabled] {
				opacity: 0.5;
				cursor: default;
			}
			.viewer__body {
				flex: 1;
				min-height: 0;
				overflow: auto;
				overscroll-behavior: contain;
				padding: var(--sp-4);
			}
			.viewer--image .viewer__body,
			.viewer--video .viewer__body {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0;
			}
			.viewer--image img,
			.viewer--video video {
				width: 100%;
				height: 100%;
				max-width: 100%;
				max-height: 100%;
				object-fit: contain;
			}
			.viewer--audio .viewer__body {
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.viewer--audio audio {
				width: 100%;
			}

			.viewer__body pre.plain {
				margin: 0;
				white-space: pre-wrap;
				word-break: break-word;
				font:
					400 13px/1.6 ui-monospace,
					SFMono-Regular,
					Menlo,
					Consolas,
					monospace;
			}
			.md {
				max-width: 600px;
			}
			.md > :first-child {
				margin-top: 0;
			}
			.md h1 {
				font-size: 24px;
			}
			.md h2 {
				font-size: 18px;
			}
			.md h3 {
				font-size: 16px;
			}
			.md pre {
				background: var(--bg);
				padding: var(--sp-3);
				border-radius: var(--r-sm);
				overflow-x: auto;
			}
			.md code {
				background: var(--bg);
				padding: 2px 4px;
				border-radius: 4px;
				font:
					400 13px/1.5 ui-monospace,
					SFMono-Regular,
					Menlo,
					Consolas,
					monospace;
			}
			.md pre code {
				background: none;
				padding: 0;
			}
			.md blockquote {
				margin: 0 0 var(--sp-3);
				padding-left: var(--sp-3);
				border-left: 3px solid var(--line);
				color: var(--ink-80);
			}
			.md table {
				border-collapse: collapse;
			}
			.md th,
			.md td {
				border: 1px solid var(--line);
				padding: var(--sp-1) var(--sp-2);
			}
			.md img {
				max-width: 100%;
			}
			.md a {
				color: var(--accent);
			}

			/* 编辑器：复用 .panel 外壳；z-index 高于遮罩，编辑时不被压暗 */
			.editor {
				z-index: 67;
			}
			.editor__bar {
				display: flex;
				align-items: center;
				gap: var(--sp-2);
				padding: calc(var(--sp-2) + env(safe-area-inset-top)) var(--sp-2) var(--sp-2) var(--sp-4);
				border-bottom: 1px solid var(--line);
			}
			.editor__title {
				flex: 1;
				min-width: 0;
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			/*
			 * 「未保存」标记。dirty 原来只用来决定要不要弹「放弃」确认，界面上完全看不出来 ——
			 * 而「查看」渲染的正是**未保存**的内容，不给标记的话用户会以为文件已经改好了。
			 */
			.editor__dirty {
				flex: none;
				font-size: 12px;
				color: var(--ink-60);
				white-space: nowrap;
			}
			.editor__body {
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
				gap: var(--sp-2);
				overflow-y: auto;
				/*padding: var(--sp-4);*/
			}
			.editor__field {
				display: flex;
				flex-direction: column;
				gap: var(--sp-1);
			}
			.editor__label {
				font-size: 13px;
				color: var(--ink-60);
			}
			.editor__input,
			.editor__text {
				width: 100%;
				min-height: var(--tap);
				padding: var(--sp-3);
				border: 1px solid var(--line);
				border-radius: var(--r-md);
				background: var(--surface);
				color: var(--ink);
				font: inherit;
				font-size: 16px; /* ≥16px，避免 iOS 聚焦输入框时自动放大页面 */
			}
			.editor__input:focus,
			.editor__text:focus {
				border-color: var(--accent);
				outline: none;
			}
			.editor__text {
				flex: 1;
				min-height: 45dvh;
				resize: none;
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				line-height: 1.6;
			}

			/*
			 * 「查看」面板。尺寸规则必须与 .editor__text **完全一致**。
			 * .editor 是从底部吸附的（left/right/bottom = 0），内容高 1px 整块面板就往上挪 1px，
			 * 而高度没有过渡——看着就是硬跳一下。两者共用 flex:1 + min-height:45dvh，切换时高度不变。
			 */
			.editor__preview {
				flex: 1;
				min-height: 45dvh;
				padding: var(--sp-3);
				border: 1px solid var(--line);
				border-radius: var(--r-md);
				background: var(--surface);
				overflow-y: auto;
				overscroll-behavior: contain;
			}
			.editor__error,
			.editor__warn {
				margin: 0;
				font-size: 14px;
				color: var(--danger);
			}
			.editor__discard {
				display: flex;
				flex-direction: column;
				gap: var(--sp-1);
				padding: var(--sp-3);
				border: 1px solid var(--danger);
				border-radius: var(--r-md);
				background: var(--danger-soft);
			}
			.editor__discard > span {
				font-weight: 600;
			}

			.dropzone {
				position: fixed;
				inset: var(--sp-4);
				z-index: 70;
				display: grid;
				place-items: center;
				border: 2px dashed var(--accent);
				border-radius: var(--r-lg);
				background: rgba(236, 253, 245, 0.96);
				color: var(--accent);
				font-weight: 600;
				pointer-events: none;
			}

			/*
			 * 居中**不用 transform**。
			 *
			 * 原来写的是 left: 50% + transform: translateX(-50%)，但 x-transition.opacity 在进场
			 * 动画期间会往同一个元素上写内联 transform: scale(1)（还带 transform-origin），
			 * 内联样式压过样式表 —— 于是动画那 150ms 里 translateX(-50%) 整个失效，提示条左边缘
			 * 就贴在视口中心线上，等过渡结束 Alpine 清掉内联样式，它再硬跳回正中。
			 * 实测一条 355px 宽的提示会横跳 177px，每次出现都跳一次。
			 *
			 * 换成左/右都贴 0 再让 auto 外边距分掉剩余空间：定宽盒子（见下面的 --progress）
			 * 和不定宽的盒子都能居中，而且跟 transform 完全无关，谁写内联都影响不到。
			 */
			.toast {
				position: fixed;
				left: 0;
				right: 0;
				margin: 0 auto;
				width: fit-content;
				bottom: calc(88px + env(safe-area-inset-bottom));
				z-index: 80;
				max-width: 90vw;
				/* 提示文字 + （归档进行中才有的）取消按钮 */
				display: flex;
				align-items: center;
				gap: var(--sp-3);
				padding: var(--sp-3) var(--sp-4);
				border-radius: var(--r-md);
				background: var(--ink);
				color: #fff;
				font-size: 14px;
				box-shadow: 0 8px 24px rgba(15, 23, 42, 0.24);
			}

			/*
			 * 进度态：打包 / 解压 / 批量上传这种**会连续换文字**的提示条。
			 *
			 * 提示条是居中的（left: 50% + translateX(-50%)），宽度又由内容决定 —— 文字一换长度，
			 * 盒子就跟着伸缩，两个边一起往外跑。实测同一屏宽下，从「链接已复制」到一条带长文件名的
			 * 上传进度，左边缘能横移 126px：看着就是提示条在左右乱晃。
			 *
			 * 进度态里把宽度钉死，只换文字。420px 与桌面端面板（min(420px, 92vw)）同宽，
			 * 90vw 这个上限与上面的 max-width 保持一致。
			 */
			.toast--progress {
				width: min(420px, 90vw);
			}
			/*
			 * 定宽之后文字得自己收着：长文件名会换行，盒子又开始上下跳，还会把「取消」挤走。
			 * flex: 1 把取消按钮顶到最右，文字从左边排 —— 像终端里的一行状态，读起来最稳。
			 */
			.toast--progress .toast__text {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			/* 深色底上的次级按钮；触控目标仍按约定做到 ≥ 44px */
			.toast__cancel {
				flex: none;
				min-height: 44px;
				padding: 0 var(--sp-3);
				border: 0;
				border-radius: var(--r-sm);
				background: rgba(255, 255, 255, 0.16);
				color: #fff;
				font: inherit;
				cursor: pointer;
			}

			.toast__cancel:hover {
				background: rgba(255, 255, 255, 0.28);
			}

			@media (min-width: 640px) {
				.content {
					max-width: 760px;
					margin: 0 auto;
					width: 100%;
				}
				/* 顶栏保留整条背景与分隔线，只把内容对齐到 760px 主列 */
				.app-bar {
					padding-left: max(var(--sp-3), calc((100% - 760px) / 2));
					padding-right: max(var(--sp-2), calc((100% - 760px) / 2));
				}
				.sheet {
					left: 50%;
					right: auto;
					bottom: auto;
					top: 50%;
					width: min(420px, 92vw);
					border-radius: var(--r-lg);
					transform: translate(-50%, -46%) scale(0.98);
					transition:
						transform 0.18s ease,
						opacity 0.18s ease;
					opacity: 0;
				}
				.sheet.open {
					transform: translate(-50%, -50%) scale(1);
					opacity: 1;
				}
				.panel {
					inset: 0 0 0 auto;
					width: min(760px, 92vw);
					transform: translateX(100%);
					box-shadow: -8px 0 32px rgba(15, 23, 42, 0.16);
				}
				.panel.open {
					transform: translateX(0);
				}
			}
		</style>
	</head>

		<div
			class="app"
			x-data="browser()"
			x-init="init()"
			x-effect="document.body.classList.toggle('locked', !!(viewer.open || sheet || confirmTarget || newMenu || folder.open || editor.open || uploadConflicts))"
			@dragover.prevent="dragging = true"
			@dragleave="dragging = false"
			@drop.prevent="onDrop($event)"
		>
			<header class="app-bar">
				<h1 class="sr-only">R2 Storage</h1>
				<nav id="breadcrumbs" class="crumbs" aria-label="Breadcrumb path" x-ref="crumbs">
					<template x-for="(crumb, index) in crumbs" :key="crumb.href">
						<span class="crumbs__part">
							<span class="crumb-sep" x-show="index > 0">/</span>
							<a
								class="crumb"
								:class="{ 'crumb--current': index === crumbs.length - 1 }"
								:href="crumb.href"
								x-text="crumb.label"
							></a>
						</span>
					</template>
				</nav>
				<button
					id="refresh-button"
					class="icon-btn"
					@click="load()"
					:disabled="loading"
					title="刷新"
					aria-label="Refresh"
				>
					<svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
				</button>
			</header>

			<main class="content">
				<div x-show="loading" aria-hidden="true">
					<div class="list">
						<div class="skeleton"></div>
						<div class="skeleton"></div>
						<div class="skeleton"></div>
					</div>
				</div>

				<div class="state state--error" x-show="!loading && error">
					<span class="state__icon"
						><svg class="icon" aria-hidden="true"><use href="#i-warning"></use></svg
					></span>
					<p x-text="error"></p>
					<div class="state__actions">
						<button id="retry-button" class="btn btn--ghost" @click="load()" aria-label="Retry">重试</button>
					</div>
				</div>

				<div class="state state--warn" x-show="!loading && !error && truncated" role="status">
					<span class="state__icon"
						><svg class="icon" aria-hidden="true"><use href="#i-warning"></use></svg
					></span>
					<p>目录成员过多，只列出前 3000 项；未列出的内容请用更具体的路径访问。</p>
				</div>

				<div class="state" x-show="!loading && !error && entries.length === 0">
					<span class="state__icon"
						><svg class="icon" aria-hidden="true"><use href="#i-folder-open"></use></svg
					></span>
					<p>这个目录还是空的</p>
					<div class="state__actions">
						<button
							id="upload-first-button"
							class="btn btn--ghost"
							@click="pickerRef().click()"
							aria-label="Upload a file"
						>
							上传第一个文件
						</button>
					</div>
				</div>

				<ul id="entry-list" class="list" x-show="!loading && !error && entries.length > 0">
					<template x-for="(entry, index) in entries" :key="entry.href">
						<li
							class="row"
							:id="'entry-row-' + index"
							:class="{ 'row--pressing': pressAt && pressAt.name === entry.name }"
							:data-entry-name="entry.name"
							:data-entry-dir="entry.isDir ? 'true' : 'false'"
							@pointerdown="pressDown(entry, $event)"
							@pointermove="pressMove($event)"
							@pointerup="pressUp()"
							@pointercancel="pressUp()"
							@pointerleave="pressUp()"
							@click.capture="swallowPressClick($event)"
							@contextmenu.prevent="selectEntry(entry)"
						>
							<button
								class="row__main"
								:id="'entry-open-' + index"
								@click="open(entry)"
								:title="entry.name"
								:aria-label="'Open ' + entry.name"
							>
								<span class="row__icon" :class="'row__icon--' + iconFor(entry)"
									><svg class="icon" aria-hidden="true"><use :href="'#i-' + iconFor(entry)"></use></svg
								></span>
								<span class="row__text">
									<span class="row__name" x-text="entry.name"></span>
									<span class="row__meta" x-text="metaFor(entry)"></span>
								</span>
							</button>
							<button
								class="icon-btn row__more"
								:id="'entry-more-' + index"
								@click="selectEntry(entry)"
								:aria-label="'Actions for ' + entry.name"
							>
								<svg class="icon" aria-hidden="true"><use href="#i-more"></use></svg>
							</button>
						</li>
					</template>
				</ul>
			</main>

			<button id="new-button" class="fab" @click="openNewMenu()" aria-label="New">
				<svg class="icon" aria-hidden="true"><use href="#i-add"></use></svg><span>新建</span>
			</button>
			<input
				id="file-input"
				class="file-input"
				type="file"
				multiple
				x-ref="picker"
				@change="onPick($event)"
				aria-hidden="true"
				tabindex="-1"
				style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
			/>

			<div
				id="backdrop"
				class="backdrop"
				aria-hidden="true"
				:class="{ open: !!(sheet || confirmTarget || newMenu || folder.open || editor.open || uploadConflicts) }"
				@click="closeAllPanels()"
			></div>

			<template x-if="newMenu">
				<div id="new-menu-panel" class="sheet sheet--new open" role="dialog" aria-modal="true" aria-label="New">

			<div

		<script>
			// 目录打包 / 解压实现在 src/archive.client.js（见那里的注释）。这里只保留页面状态，
			// 不再内联体积庞大的归档逻辑 —— 那个文件可以整个删掉而不影响页面其它部分。

			// 与 src/ui.ts 的 MARKDOWN_EXTENSIONS 保持一致。
			const MARKDOWN_EXTENSIONS = ['md', 'markdown', 'mdown'];

			// markdown-it 实例只建一次。放在组件外面是故意的：Alpine 会深度代理 $data，
			// 一个带内部状态的渲染器实例被代理后很容易出怪问题（而且白白变慢）。
			let markdown_renderer = null;

			// 长按判定：500ms 是 iOS 3D Touch / Android 长按的常规量级；
			// 允许 10px 抖动，免得手指微不足道的移动就把长按取消掉。
			const LONG_PRESS_MS = 500;
			const LONG_PRESS_MOVE = 10;

			function markdown_to_html(text) {
				if (!markdown_renderer) {
					markdown_renderer = window.markdownit({ html: true, linkify: true, typographer: true, breaks: true });
				}
				return markdown_renderer.render(text);
			}

			/**
			 * 触感反馈。
			 *
			 * `navigator.vibrate` 只有 Android Chrome 这类才有；**iOS Safari 没有这个 API**
			 * （所以长按那里必须有视觉替代 —— 不能把反馈全押在震动上），桌面浏览器一般也没有。
			 * 不支持就静默跳过：这只是增强，任何情况下都不应该影响操作本身。
			 *
			 * 时长/节奏用来区分「分量」：轻点最短，按住略重，完成两下，失败两下更重更长。
			 * 都做一样长的话，用户分不出刚刚是成功了还是出错了。
			 */
			const HAPTIC = { tap: 8, press: 16, done: [12, 40, 24], error: [28, 60, 28] };

			function buzz(kind) {
				try {
					if (typeof navigator.vibrate === 'function') navigator.vibrate(HAPTIC[kind] || HAPTIC.tap);
				} catch {
					// 个别 WebView 会直接抛；反馈失败绝不能让主流程跟着一起失败
				}
			}

			window.browser = function () {
				return {
					entries: [],
					truncated: false,
					loading: true,
					error: '',
					busy: false,
					// 归档操作（打包 / 解压）进行中时持有 AbortController，否则为 null。
					// 它既用来挡重入，也决定提示条上要不要出现「取消」——不需要额外的布尔标志。
					archiveAbort: null,
					// 长按手势的临时状态。pressTimer 非空表示“正在计时”；
					// pressFired 表示这次长按已经弹过面板，用来吃掉松手时的那个 click。
					pressTimer: null,
					pressAt: null,
					pressFired: false,
					dragging: false,
					toast: '',
					// 提示条当前要不要按「进度」显示（定宽，见 CSS 里 .toast--progress 的注释）。
					// 置位可以在可见时发生（顶多跳一下），**复位只在提示条隐藏时做** —— 收尾那一刻
					// 要是宽度变了，会看到它先缩回去再消失。
					toastProgress: false,
					sheet: null,
					confirmTarget: null,
					uploadConflicts: null,
					newMenu: false,
					folder: { open: false, name: '', busy: false, error: '' },
					rename: { active: false, original: '', draft: '', error: '', pending: null },
					viewer: {
						open: false,
						entry: null,
						kind: '',
						title: '',
						href: '',
						status: 'loading',
						text: '',
						html: '',
						error: '',
					},
					editor: {
						open: false,
						href: '',
						name: '',
						text: '',
						contentType: null,
						dirty: false,
						conflict: false,
						busy: false,
						error: '',
						confirmDiscard: false,
						// 是否正在「查看」；html 是已渲染的结果，renderedFrom 是它对应的原文。
						// 三者都只在打开/关闭编辑器时重置，在编辑 ⇄ 查看之间来回切不丢。
						preview: false,
						html: '',
						renderedFrom: '',
					},

					init() {
						this.load();
						this.scrollCrumbs();
						document.addEventListener('keydown', (event) => {
							if (event.key !== 'Escape') return;
							if (this.confirmTarget) this.confirmTarget = null;
							else if (this.uploadConflicts) this.uploadConflicts = null;
							else if (this.sheet) this.closeAllPanels();
							else if (this.folder.open) this.folder.open = false;
							else if (this.newMenu) this.newMenu = false;
							else if (this.editor.open) this.requestCloseEditor();
							else if (this.viewer.open) this.closeViewer();
						});
					},

					/** 选中某个条目的操作面板。换条目之前先把待提交的改名落盘。 */
					/**
					 * 弹出文件操作面板。
					 *
					 * kind 用来区分“怎么打开的”：长按识别成功应该比轻点 ⋯ 重一点 —— 那是触屏上
					 * 唯一能替 3D Touch 给的反馈。注意不能先 buzz('press') 再让这里 buzz('tap')：
					 * 新的一次 vibrate() 会取消上一次，后调的会把前面的盖掉。
					 */
					selectEntry(entry, kind) {
						this.commitRename();
						this.sheet = entry;
						buzz(kind || 'tap');
					},

					/**
					 * 长按（触屏 / 触控笔）弹出文件操作面板。
					 *
					 * 和行尾的 ⋯ 是同一件事，只多一个更顺手的手势。⋯ 必须保留 ——
					 * 长按既不可发现、也没法用键盘或读屏触发，不能当成唯一入口。
					 */
					pressDown(entry, event) {
						// 鼠标不参与：桌面端的等价物是右键，而且按住左键 500ms 弹菜单
						// 会跟选词、拖拽抢事件
						if (event.pointerType === 'mouse') return;
						this.clearPressTimer();
						this.pressAt = { name: entry.name, x: event.clientX, y: event.clientY };
						// 每次按下都重置：pointerdown 一定先于 click，所以把上次长按的标记
						// 在这里清掉，就不会有“卡住不消失、之后每次点击都被吞”的残留状态
						this.pressFired = false;
						this.pressTimer = setTimeout(() => {
							this.pressTimer = null;
							this.pressFired = true;
							this.selectEntry(entry, 'press');
						}, LONG_PRESS_MS);
					},

					/**
					 * 手指移开就取消长按。
					 *
					 * 这条不能省：列表要能滑，不取消的话任何一次稍慢的扇动都会在停下时弹出面板。
					 */
					pressMove(event) {
						if (this.pressTimer === null || !this.pressAt) return;
						if (
							Math.abs(event.clientX - this.pressAt.x) > LONG_PRESS_MOVE ||
							Math.abs(event.clientY - this.pressAt.y) > LONG_PRESS_MOVE
						) {
							this.pressUp();
						}
					},

					pressUp() {
						this.clearPressTimer();
						this.pressAt = null;
					},

					clearPressTimer() {
						if (this.pressTimer !== null) {
							clearTimeout(this.pressTimer);
							this.pressTimer = null;
						}
					},

					/**
					 * 吃掉长按之后必然到来的那个 click。
					 *
					 * 少了这一步:「按住 → 弹出面板 → 松手」会顺便把文件也打开，面板被后面那次
					 * click 顶掉 —— 用户看到的是菜单一闪而过。在**捕获阶段**拦，这样行内两个
					 * 按钮的 @click 都不会收到事件。
					 */
					swallowPressClick(event) {
						if (!this.pressFired) return;
						this.pressFired = false;
						event.preventDefault();
						event.stopPropagation();
					},

					/**
					 * 关闭全部面板。
					 *
					 * 这里是“点别处 = 保存”的着力点：不能指望 @blur —— 面板是 x-if 渲染的，
					 * 元素被移出 DOM 时浏览器不补发 blur/focusout（两者实测都不触发）；
					 * 而在本项目环境里“点非聚焦元素”也不会让输入框失焦。所以每个关闭或切换
					 * 面板的路径都显式提交一次；值没变则一个请求都不发。
					 */
					closeAllPanels() {
						this.commitRename();
						this.sheet = null;
						this.confirmTarget = null;
						this.newMenu = false;
						this.folder.open = false;
						this.uploadConflicts = null;
					},

					async load() {
						this.loading = true;
						this.error = '';
						try {
							const response = await fetch(location.pathname + '?format=json', {
								credentials: 'include',
								headers: { Accept: 'application/json' },
							});
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							const data = await response.json();
							this.entries = data.entries;
							this.truncated = data.truncated === true;
						} catch (err) {
							this.error = '目录加载失败：' + err.message;
						} finally {
							this.loading = false;
						}
					},

					get crumbs() {
						const parts = decodeURIComponent(location.pathname).split('/').filter(Boolean);
						const trail = [{ label: '根目录', href: '/' }];
						let path = '';
						for (const part of parts) {
							path += '/' + part;
							trail.push({ label: part, href: path + '/' });
						}
						return trail;
					},

					/** 路径较深时把面包屑滚到末尾，保证当前目录始终可见。 */
					scrollCrumbs() {
						this.$nextTick(() => {
							const el = this.$refs.crumbs;
							if (el) el.scrollLeft = el.scrollWidth;
						});
					},

					iconFor(entry) {
						if (entry.isDir) return 'folder';
						if (entry.kind) return entry.kind;
						return /\.(zip|rar|7z|tar|gz|bz2|xz)$/i.test(entry.name) ? 'archive' : 'file';
					},

					metaFor(entry) {
						if (entry.isDir) return '目录';
						return this.formatSize(entry.size) + ' · ' + this.formatDate(entry.modified);
					},

					/** 只有文本类文件能在网页里编辑：其它类型没有可靠的文本往返。 */
					canEdit(entry) {
						return !!entry && (entry.kind === 'text' || entry.kind === 'markdown');
					},

					formatSize(bytes) {
						const units = ['B', 'KB', 'MB', 'GB', 'TB'];
						let value = bytes;
						let unit = 0;
						while (value >= 1024 && unit < units.length - 1) {
							value = value / 1024;
							unit++;
						}
						return (unit === 0 ? value : value.toFixed(1)) + ' ' + units[unit];
					},

					formatDate(iso) {
						const date = new Date(iso);
						const pad = (n) => String(n).padStart(2, '0');
						return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
					},

					pickerRef() {
						return this.$refs.picker;
					},

					open(entry) {
						if (entry.isDir) {
							location.href = entry.href;
							return;
						}
						if (entry.kind) this.preview(entry);
						else location.href = entry.href;
					},

					/** 从预览层进入编辑：先关掉预览，否则保存后预览里还是旧内容。 */
					async editFromViewer() {
						const entry = this.viewer.entry;
						if (!entry) return;
						this.closeViewer();
						await this.editExisting(entry);
					},

					async preview(entry) {
						// 改名可能还在落盘：entry 的 href 会在成功后就地更新，先等它，否则预览会去取旧路径
						await this.settleRename();
						buzz('tap');
						this.sheet = null;
						this.viewer = {
							open: true,
							entry,
							kind: entry.kind,
							title: entry.name,
							href: entry.href,
							status: 'loading',
							text: '',
							html: '',
							error: '',
						};

						if (entry.kind !== 'text' && entry.kind !== 'markdown') {
							this.viewer.status = 'ready';
							return;
						}

						try {
							const response = await fetch(entry.href, { credentials: 'include' });
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							const text = await response.text();
							if (entry.kind === 'markdown') {
								await this.loadMarkdown();
								this.viewer.html = markdown_to_html(text);
								this.viewer.status = 'ready';
								// 等 Alpine 把 HTML 写进 DOM 之后再画 mermaid 图
								await this.$nextTick();
								await this.renderMermaid(this.$refs.viewerBody);
							} else {
								this.viewer.text = text;
								this.viewer.status = 'ready';
							}
						} catch (err) {
							this.viewer.status = 'error';
							this.viewer.error = '预览失败：' + err.message;
						}
					},

					loadScript(src) {
						if (document.querySelector('script[src="' + src + '"]')) return Promise.resolve();
						return new Promise((resolve, reject) => {
							const script = document.createElement('script');
							script.src = src;
							script.onload = resolve;
							script.onerror = reject;
							document.head.appendChild(script);
						});
					},

					async loadMarkdown() {
						await this.loadScript('https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js');
						await this.loadScript('https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js');
					},

					// markdown-it 会把 mermaid 代码块渲染成 <pre><code>，这里换成 mermaid 节点再绘制。
					// root 是**包含**已渲染 markdown 的那个元素（预览面板 / 编辑器里的「查看」）。
					async renderMermaid(root) {
						if (!window.mermaid || !root) return;
						root.querySelectorAll('code.language-mermaid').forEach((block) => {
							const container = document.createElement('div');
							container.className = 'mermaid';
							container.textContent = block.textContent;
							block.parentNode.replaceWith(container);
						});
						const nodes = root.querySelectorAll('.mermaid:not([data-processed])');
						if (nodes.length === 0) return;
						window.mermaid.initialize({ startOnLoad: false });
						await window.mermaid.run({ nodes });
					},

					closeViewer() {
						this.viewer.open = false;
						this.viewer.entry = null;
						this.viewer.href = '';
						this.viewer.html = '';
						this.viewer.text = '';
					},

					/**
					 * 新建文本文件时的默认名。
					 *
					 * 不再固定用 untitled.txt：那个名字只要已存在，新建流程就会立刻撞上重名，
					 * 而“再点一次保存”确实会把它覆盖掉。这里直接在当前目录的条目里挑一个不冲突的
					 * 名字（数据已经在手上，不需要额外请求）。
					 */
					default_new_name() {
						const taken = new Set(this.entries.map((entry) => entry.name));
						if (!taken.has('untitled.txt')) return 'untitled.txt';
						for (let index = 2; index < 1000; index++) {
							const candidate = 'untitled-' + index + '.txt';
							if (!taken.has(candidate)) return candidate;
						}
						return 'untitled.txt';
					},

					/** 打开「新建」菜单。单独抽一个方法只为了让触感有个落脚点。 */
					openNewMenu() {
						buzz('tap');
						this.newMenu = true;
					},

					/** 打开新建目录面板：默认名同样从已有条目里挑一个不冲突的。 */
					openFolder() {
						buzz('tap');
						this.newMenu = false;
						this.sheet = null;
						this.folder = { open: true, name: this.default_folder_name(), busy: false, error: '' };
					},

					/**
					 * 新建目录时的默认名。
					 *
					 * 和 default_new_name() 同理：不能用固定名，否则第二次新建就必定撞名，
					 * 而 MKCOL 撞名只会得到一个 405，用户看到的是一句没头没脑的报错。
					 *
					 * 用英文而不是中文名：目录名会直接进 URL，中文会被百分号编码成一大串
					 * %E6%96%B0... ，既难读也难与别人对若。文本文件的默认名本来也是英文
					 * （untitled.txt），两边风格正好一致。
					 */
					default_folder_name() {
						const taken = new Set(this.entries.map((entry) => entry.name));
						if (!taken.has('new-folder')) return 'new-folder';
						for (let index = 2; index < 1000; index++) {
							const candidate = 'new-folder-' + index;
							if (!taken.has(candidate)) return candidate;
						}
						return 'new-folder';
					},

					/**
					 * MKCOL 建目录。
					 *
					 * 目录在 R2 里是一个带 resourcetype 标记的空对象，所以这里必须先建目录再传文件；
					 * 不做“已存在就静默成功”—— 405/409 都是真实错误，要如实报给用户（
					 * 409 通常意味着父级已经不是集合了）。
					 */
					async createFolder() {
						const name = this.folder.name.trim();
						const invalid = this.check_name(name, '目录名');
						if (invalid) {
							this.folder.error = invalid;
							return;
						}

						this.folder.busy = true;
						this.folder.error = '';
						try {
							// 尾部斜杠是集合的规范写法；服务端 make_resource_path 会去掉它再取 key
							const response = await fetch(location.pathname + encodeURIComponent(name) + '/', {
								method: 'MKCOL',
								credentials: 'include',
							});
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							this.folder.open = false;
							this.notify('已创建目录 ' + name, 'done');
							await this.load();
						} catch (err) {
							this.folder.error = '创建失败：' + err.message;
							buzz('error');
						} finally {
							this.folder.busy = false;
						}
					},

					/**
					 * 点标题进入改名（只对文件；目录改名是递归重写每个子键，不在这轮范围内）。
					 *
					 * 进入时不改值，所以“点一下又关掉”不会误改 —— 值没变就不发请求。
					 */
					enterRename() {
						if (!this.sheet || this.sheet.isDir) return;
						this.rename = { active: true, original: this.sheet.name, draft: this.sheet.name, error: '', pending: null };
						this.$nextTick(() => {
							const input = document.getElementById('rename-input');
							if (!input) return;
							input.focus();
							// 只选中主文件名，扩展名留着：改名绝大多数情况下不动后缀
							const dot = this.rename.draft.lastIndexOf('.');
							input.setSelectionRange(0, dot > 0 ? dot : this.rename.draft.length);
						});
					},

					cancelRename() {
						this.rename = { active: false, original: '', draft: '', error: '', pending: null };
					},

					/**
					 * 提交改名（= 同目录 MOVE）。
					 *
					 * 触发点：Enter / @blur / 任何关闭或切换面板的路径。@blur 只当锦上添花 ——
					 * 真正靠得住的是 closeAllPanels / selectEntry 这些必经之路上的显式调用。
					 *
					 * 返回一个 Promise（没有待提交的改名时返回 null），调用方可以 await 它再读 href。
					 */
					commitRename() {
						if (!this.rename.active) return null;
						const name = this.rename.draft.trim();
						if (name === this.rename.original) {
							this.cancelRename();
							return null;
						}
						const invalid = this.check_name(name, '文件名');
						if (invalid) {
							// 非法名不关面板，留在编辑态让用户改
							this.rename.error = invalid;
							return null;
						}
						const entry = this.sheet;
						if (!entry) {
							this.cancelRename();
							return null;
						}
						// 先退出编辑态，避免同一个改名被重复提交
						this.rename.active = false;
						this.rename.error = '';
						this.rename.pending = this.renameEntry(entry, name);
						return this.rename.pending;
					},

					/** 等挂起的改名落盘。任何要读 href 的动作都得先过这一关，否则拿到的是旧路径。 */
					async settleRename() {
						const pending = this.commitRename();
						if (pending) await pending;
					},

					async renameEntry(entry, name) {
						const old_href = entry.href;
						const new_href = location.pathname + encodeURIComponent(name);
						try {
							const response = await fetch(old_href, {
								method: 'MOVE',
								credentials: 'include',
								headers: {
									// Destination 必须是绝对 URL，且 host 要和请求完全一致，否则服务端回 502
									Destination: location.origin + new_href,
									// 必须显式 F！MOVE 缺省是 T，会把同名目标先删掉 ——
									// 目标恰好是目录时是**递归删光**它底下的所有对象。
									Overwrite: 'F',
								},
							});
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							this.applyRename(entry, old_href, name, new_href);
							this.notify('已重命名为 ' + name, 'done');
						} catch (err) {
							this.notify('重命名失败：' + err.message, 'error');
						} finally {
							this.rename.pending = null;
						}
						await this.load();
					},

					/**
					 * 改名成功后就地更新各处持有的引用。
					 *
					 * 漏掉任何一处都会留下隐性 bug：
					 *  - sheet / viewer 还指着旧 href → 之后点预览或下载拿到 404
					 *  - editor 还指着旧 href → 下一次保存会把**旧文件写回来**，一个文件变两个
					 */
					applyRename(entry, old_href, name, new_href) {
						entry.name = name;
						entry.href = new_href; // entry 就是 this.sheet，标题与动作随之更新
						if (this.viewer.entry === entry) {
							this.viewer.title = name;
							this.viewer.href = new_href;
						}
						if (this.editor.href === old_href) {
							this.editor.href = new_href;
							this.editor.name = name;
						}
					},

					/**
					 * 下载。
					 *
					 * 改名还挂在半路时 sheet.href 已经过期，先等它落盘再放行，
					 * 否则“改完名马上点下载”会拿到 404。没待办时也走这里，只多一次空等。
					 */
					async downloadEntry(entry, event) {
						event.preventDefault();
						await this.settleRename();
						if (entry.isDir) return this.zipFolder(entry);
						buzz('tap');
						const link = document.createElement('a');
						link.href = entry.href;
						link.download = entry.name;
						document.body.appendChild(link);
						link.click();
						link.remove();
					},

					/**
					 * 目录打包下载。实现全在 `src/archive.client.js` 里 —— 这里只负责把进度
					 * 接到提示条上，并把结果报出来。
					 */
					async zipFolder(entry) {
						await this.runArchive('压缩', async (signal, onProgress) => {
							const result = await window.R2Archive.downloadFolderAsZip(entry, { onProgress, signal });
							this.notify('已压缩 ' + result.files + ' 个文件', 'done');
						});
					},

					/** 只有 zip 能解压（JSZip 只认这一种格式）。 */
					canExtract(entry) {
						return !!entry && !entry.isDir && /\.zip$/i.test(entry.name);
					},

					/** 「压缩为 zip」只对目录有意义（文件本来就是文件）。 */
					canCompress(entry) {
						return !!entry && entry.isDir;
					},

					/**
					 * 压缩为 zip：在当前目录生成真实的 `<目录名>.zip` 对象，**不下载**。
					 *
					 * 生成之后它就是个普通文件，想下载再点它（或直接用 Finder）。代价是整个 zip 要额
					 * 外上传一遍，所以“只想拿走一份”应该用「压缩下载」而不是这个。
					 */
					async compressEntry(entry) {
						// 改名还挂在半路时 href 已经过期，先等它落盘再放行
						await this.settleRename();
						this.sheet = null;
						await this.runArchive('压缩', async (signal, onProgress) => {
							const result = await window.R2Archive.storeFolderAsZip(entry, { onProgress, signal });
							this.notify('已生成 ' + entry.name + '.zip（' + this.formatSize(result.bytes) + '）', 'done');
							await this.load();
						});
					},

					/** 解压到同名目录。实现全在 `src/archive.client.js` 里。 */
					async extractEntry(entry) {
						// 改名还挂在半路时 href 已经过期，先等它落盘再放行
						await this.settleRename();
						this.sheet = null;
						await this.runArchive('解压', async (signal, onProgress) => {
							const result = await window.R2Archive.extractZipToFolder(entry, { onProgress, signal });
							this.notify('已解压 ' + result.files + ' 个文件到 ' + entry.name.replace(/\.zip$/i, '') + '/', 'done');
							await this.load();
						});
					},

					/**
					 * 归档操作的公共外壳：挡重入、把进度接到提示条上、结束时收掉 AbortController。
					 *
					 * 压缩（直接下载 / 生成到服务器）和解压都是「多请求、非原子」的长任务，
					 * 所以三者都提供真能停下来的取消（失败或取消时，模块会把半成品清掉）。
					 */
					async runArchive(label, task) {
						if (this.archiveAbort) return;
						const controller = new AbortController();
						this.archiveAbort = controller;
						// 长任务的起点也给一次轻反馈：后面的几秒都没动静，得先确认“按到了”
						buzz('tap');
						try {
							await task(controller.signal, (text) => this.notifySticky(text));
						} catch (err) {
							// 用户主动取消不该被说成「失败」，原样把模块的说明（含清理结果）转出来
							this.notify(
								controller.signal.aborted ? err.message : label + '失败：' + err.message,
								controller.signal.aborted ? 'tap' : 'error',
							);
						} finally {
							this.archiveAbort = null;
						}
					},

					/** 取消进行中的归档操作。 */
					cancelArchive() {
						if (this.archiveAbort) this.archiveAbort.abort();
					},

					/** 新名称校验（文件名 / 目录名共用，保证两处规则一致）。 */
					check_name(name, label) {
						if (!name) return '请填写' + label;
						if (name.includes('/') || name.includes('\\')) return label + '不能包含斜杠';
						return '';
					},

					/** 打开编辑器：不传参为新建，传入 { href, name, text } 则编辑已有文件。 */
					openEditor(entry) {
						buzz('tap');
						this.newMenu = false;
						this.sheet = null;
						this.editor = {
							open: true,
							href: entry ? entry.href : '',
							name: entry ? entry.name : this.default_new_name(),
							text: entry ? entry.text : '',
							// 编辑已有文件时沿用原 Content-Type，避免仅仅编辑一下就顺手改了它的元数据
							contentType: (entry && entry.contentType) || null,
							dirty: false,
							conflict: false,
							busy: false,
							error: '',
							confirmDiscard: false,
							preview: false,
							html: '',
							renderedFrom: '',
						};
					},

					/** 编辑已有文本文件：先取回内容再进编辑器。 */
					async editExisting(entry) {
						await this.settleRename();
						this.sheet = null;
						try {
							const response = await fetch(entry.href, { credentials: 'include' });
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							this.openEditor({
								href: entry.href,
								name: entry.name,
								text: await response.text(),
								contentType: entry.contentType,
							});
						} catch (err) {
							this.notify('打开失败：' + err.message, 'error');
						}
					},

					requestCloseEditor() {
						// 有未保存内容时先确认一次，避免误点关闭丢掉刚写的东西
						if (this.editor.confirmDiscard) return this.discardEditor();
						if (this.editor.dirty && this.editor.text) this.editor.confirmDiscard = true;
						else this.discardEditor();
					},

					discardEditor() {
						this.editor.open = false;
						this.editor.confirmDiscard = false;
						this.editor.text = '';
						// 关闭即丢弃：dirty / conflict 都失去意义，留着只会变成下一轮的隐患
						// （conflict 是“用户已确认覆盖”类标记，换一个文件就不该还成立）
						this.editor.dirty = false;
						this.editor.conflict = false;
						// 只有真正关掉编辑器才丢掉已渲染的内容：在编辑 ⇄ 查看之间来回切不丢，
						// 否则每次切回查看都要重新渲染一遍（mermaid 图会闪一下）。
						this.editor.preview = false;
						this.editor.html = '';
						this.editor.renderedFrom = '';
					},

					/** 「查看」只对 markdown 有意义：纯文本/代码在编辑器里看到的就是最终样子。 */
					canPreviewEditor() {
						const name = this.editor.name || '';
						const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
						return MARKDOWN_EXTENSIONS.includes(ext);
					},

					/**
					 * 在编辑器里切换「查看」。
					 *
					 * 刻意**不关编辑器、也不动 editor.text / dirty**：用户要的是改一改 → 看一眼 → 再改。
					 * 之前想看效果只能先保存（真的写服务器）再退出再预览，而且新建文件时根本无从看起。
					 */
					async toggleEditorPreview() {
						if (this.editor.preview) {
							this.editor.preview = false;
							return;
						}
						// 先把面板显示出来再渲染：mermaid 需要节点已经在布局里才能量出尺寸
						this.editor.preview = true;
						this.editor.error = '';
						try {
							await this.loadMarkdown();
							// 内容没变就不重渲染：来回切换不该反复重画 mermaid 图
							if (this.editor.renderedFrom !== this.editor.text) {
								this.editor.html = markdown_to_html(this.editor.text);
								this.editor.renderedFrom = this.editor.text;
							}
							await this.$nextTick();
							await this.renderMermaid(this.$refs.editorPreview);
						} catch (err) {
							// 出错就退回编辑态，否则错误信息会显示在一个看不见的地方
							this.editor.preview = false;
							this.editor.error = '预览失败：' + err.message;
						}
					},

					async saveEditor() {
						const raw = this.editor.name.trim();
						const invalid = this.check_name(raw, '文件名');
						if (invalid) {
							this.editor.error = invalid;
							return;
						}
						// 没写扩展名时补 .txt，否则存完自己都预览不了
						const name = raw.includes('.') ? raw : raw + '.txt';
						const href = this.editor.href || location.pathname + encodeURIComponent(name);

						this.editor.busy = true;
						this.editor.error = '';
						try {
							// 新建时先探一下重名，避免默默覆盖掉已有文件。
							// conflict 在文件名变化时会被重置（见输入框上的 @input），所以这里的
							// “再点一次就覆盖”只针对同一个文件名成立 —— 否则改个名字就能绕过检查。
							if (!this.editor.href && !this.editor.conflict) {
								const probe = await fetch(href, { method: 'HEAD', credentials: 'include' });
								if (probe.ok) {
									this.editor.conflict = true;
									this.editor.name = name;
									return;
								}
							}
							const response = await fetch(href, {
								method: 'PUT',
								body: this.editor.text,
								credentials: 'include',
								headers: { 'Content-Type': this.editor.contentType || 'text/plain; charset=utf-8' },
							});
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							this.discardEditor();
							this.notify('已保存 ' + name, 'done');
							await this.load();
						} catch (err) {
							this.editor.error = '保存失败：' + err.message;
							buzz('error');
						} finally {
							this.editor.busy = false;
						}
					},

					async copyLink(entry) {
						if (!entry) return;
						await this.settleRename();
						const url = location.origin + entry.href;
						this.sheet = null;
						try {
							await navigator.clipboard.writeText(url);
							this.notify('链接已复制', 'tap');
						} catch {
							this.notify(url);
						}
					},

					/** 删除前先落到统一的应用内确认面板（列表和预览层共用）。 */
					askDelete(entry) {
						if (!entry) return;
						buzz('tap');
						this.sheet = null;
						this.confirmTarget = entry;
					},

					async remove() {
						const target = this.confirmTarget;
						this.busy = true;
						try {
							const response = await fetch(target.href, { method: 'DELETE', credentials: 'include' });
							if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
							this.confirmTarget = null;
							// 被删掉的正好是当前预览的文件时，一并关掉预览层
							if (this.viewer.entry && this.viewer.entry.href === target.href) this.closeViewer();
							this.notify('已删除 ' + target.name, 'done');
							await this.load();
						} catch (err) {
							this.notify('删除失败：' + err.message, 'error');
						} finally {
							this.busy = false;
						}
					},

					onPick(event) {
						const files = Array.from(event.target.files || []);
						event.target.value = '';
						this.upload(files);
					},

					onDrop(event) {
						this.dragging = false;
						this.upload(Array.from(event.dataTransfer.files || []));
					},

					async upload(files, options) {
						if (files.length === 0) return;
						// 批量上传每传完一个就换一条提示，还带着文件名，长短差很多 —— 先进定宽态。
						// 放在第一条提示之前置位：整个上传过程里宽度只定一次，之后不再变。
						// 单个文件只换一次文字（"上传中" → "已上传"），跟别的普通提示没区别，
						// 不值得为它把提示条撑成一条宽栏。
						if (files.length > 1) this.toastProgress = true;
						// 不传 options 时先按"不允许覆盖"上传：让服务端在重名时回 412，
						// 而不是静默替掉用户已有的文件。用 If-None-Match 而不是先发 HEAD 探测，
						// 是因为由服务端原子判定没有竞态窗口（探测与写入之间可能被人抢先建同名文件）。
						const overwrite = !!(options && options.overwrite);
						this.busy = true;
						const conflicts = [];
						let done = 0;
						for (const file of files) {
							this.notify('上传中 ' + (done + conflicts.length + 1) + '/' + files.length + '：' + file.name);
							try {
								const response = await fetch(location.pathname + encodeURIComponent(file.name), {
									method: 'PUT',
									body: file,
									credentials: 'include',
									headers: overwrite ? undefined : { 'If-None-Match': '*' },
								});
								if (!overwrite && response.status === 412) {
									conflicts.push(file);
									continue;
								}
								if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
								done++;
							} catch (err) {
								this.busy = false;
								this.notify('上传失败 ' + file.name + '：' + err.message, 'error');
								await this.load();
								return;
							}
						}
						this.busy = false;

						// 重名的分两类：同名文件交给用户确认，同名目录直接跳过
						// （目录的标记对象若被文件替掉，目录里的内容会变得不可见）
						//
						// 先用当前列表做一次快速判断；列表可能过期（别的客户端刚建了同名目录）
						// 或压根没加载成功，所以列表里没有的一律再向服务器确认一次 ——
						// 这一步只在出现重名时才发生，代价有限，但能杜绝"把目录覆盖成文件"。
						const dirNames = new Set(this.entries.filter((entry) => entry.isDir).map((entry) => entry.name));
						const blocked = [];
						const pending = [];
						for (const file of conflicts) {
							if (dirNames.has(file.name)) {
								blocked.push(file);
								continue;
							}
							let isDir = false;
							try {
								const probe = await fetch(location.pathname + encodeURIComponent(file.name), {
									method: 'PROPFIND',
									credentials: 'include',
									headers: { Depth: '0', 'Content-Type': 'application/xml' },
									body: '<?xml version="1.0"?><propfind xmlns="DAV:"><prop><resourcetype/></prop></propfind>',
								});
								isDir = probe.ok && (await probe.text()).includes('<collection />');
							} catch {
								// 探测失败就当作文件处理：下面的覆盖仍需用户确认
							}
							(isDir ? blocked : pending).push(file);
						}

						if (pending.length > 0) {
							this.uploadConflicts = pending;
							buzz('tap');
							if (done > 0) this.notify('已上传 ' + done + ' 个文件', 'done');
							await this.load();
							return;
						}

						// 只留一条提示：toast 只有一个槽位，后面的 notify 会把前面那条盖掉
						// （曾经因此把"跳过同名目录"盖成了毫无信息量的"已上传 0 个文件"）
						const parts = [];
						if (done > 0) parts.push('已上传 ' + done + ' 个文件');
						if (blocked.length > 0) parts.push('跳过同名目录：' + blocked.map((file) => file.name).join('、'));
						this.notify(parts.length > 0 ? parts.join('；') : '没有文件被上传', parts.length > 0 ? 'done' : 'error');
						await this.load();
					},

					/** 用户在覆盖确认里选了"覆盖":重跑一次，这次不带 If-None-Match。 */
					async confirmOverwriteUpload() {
						const files = this.uploadConflicts || [];
						this.uploadConflicts = null;
						await this.upload(files, { overwrite: true });
					},

					/**
					 * 常驻提示：给打包这类长操作推进度用。
					 *
					 * 不能直接复用 notify()，它有 2.4s 自动消失的定时器 —— 打包跑到一半提示就没了。
					 * 这里先把定时器清掉，等操作结束再交给 notify() 收尾。
					 */
					notifySticky(message) {
						clearTimeout(this.toastTimer);
						// 打包 / 解压的进度正是「文字不停换」的那种提示，必须进定宽态
						this.toastProgress = true;
						this.toast = message;
					},

					notify(message, kind) {
						if (kind) buzz(kind);
						this.toast = message;
						clearTimeout(this.toastTimer);
						this.toastTimer = setTimeout(() => {
							this.toast = '';
							// 趁提示条已经隐藏再退出定宽态：可见时改宽度会看到它跳一下。
							// 收尾那句「已解压 N 个文件」也就跟着保持定宽，不会先缩回去再消失。
							this.toastProgress = false;
						}, 2400);
					},
				};
			};
		</script>
		<script defer src="/_app/archive.client.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
	</body>
</html>
