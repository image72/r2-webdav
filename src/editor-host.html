<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Editor</title>
		<style>
			/* 弹窗宿主页：工具栏 + 全幅 iframe。移动端：44px 触达，safe-area 兜底。 */
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
				background: #0b0f14;
				color: #e6edf3;
				font:
					14px/1.4 -apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					sans-serif;
			}
			#host-bar {
				display: flex;
				align-items: center;
				gap: 10px;
				height: 48px;
				padding: 0 calc(10px + env(safe-area-inset-left)) 0 calc(10px + env(safe-area-inset-right));
				background: #11171f;
				border-bottom: 1px solid #232c37;
			}
			#host-back,
			#host-save {
				flex: none;
				min-width: 44px;
				height: 44px;
				border: 1px solid #2c3947;
				border-radius: 8px;
				background: #18202a;
				color: #e6edf3;
				font-size: 14px;
				padding: 0 14px;
			}
			#host-save[hidden] {
				display: none;
			}
			#host-title {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			#host-status {
				flex: none;
				color: #8b98a5;
				font-size: 13px;
			}
			#host-frame {
				display: block;
				width: 100%;
				/* 减工具栏高度；dvh 兜底 iOS Safari 动态工具栏。 */
				height: calc(100% - 48px);
				height: calc(100dvh - 48px);
				border: 0;
				background: #fff;
			}
		</style>
	</head>
	<body>
		<div id="host-bar">
			<button id="host-back" type="button" aria-label="Close">←</button>
			<span id="host-title"></span>
			<span id="host-status" role="status"></span>
			<button id="host-save" type="button" hidden>Save</button>
		</div>
		<iframe id="host-frame" title="Editor"></iframe>
		<!-- window.__APP_CONFIG__ 由 index.ts 的 inject_page_config 统一注入（本页是 text/html 会走同一管道）。 -->
		<script src="/_app/editors.client.js"></script>
	</body>
</html>
