compatibility_date = "2023-10-16"
main = "src/index.ts"
name = "r2-webdav"

compatibility_flags = ["nodejs_compat"]

# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#bundling
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/_app/*.client.js"]
fallthrough = true

[[r2_buckets]]
binding = "bucket" # <~ valid JavaScript variable name
bucket_name = "webdav"

# Environment variables (configured via `wrangler secret put`)
[vars]
# USERNAME = "set via Cloudflare Secrets"
# PASSWORD = "set via Cloudflare Secrets"
ONLYOFFICE_EDITOR_URL = "https://office-website-7xv.pages.dev/editor"

# External editor pages (top-level window.open, zero source modification, zero wrapper).
# draw.io uses the opener-mode embed protocol; Photopea uses signed session + hash config
# (needs SIGNING_SECRET configured for the save endpoint).
DRAWIO_EDITOR_URL = "https://drawio.image72.workers.dev/"
PHOTOPEA_EDITOR_URL = "https://photopea.image72.workers.dev/"

# Optional. Online editor page for the "open in ONLYOFFICE" action; needs SIGNING_SECRET.
# SIGNING_SECRET = "<oo-joint-test-secret>"

# Optional. Set to "1" for a pure WebDAV server: no UI, no editors, no static assets.
# HEADLESS = "1"
