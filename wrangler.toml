compatibility_date = "2023-10-16"
main = "src/index.ts"
name = "r2-webdav"

compatibility_flags = ["nodejs_compat"]

# 页面从 ui.ts 里拆出来单独放 src/index.html，作为「文本模块」引入：
#   import PAGE_HTML from './index.html'   （见 src/ui.ts）
# type 只能是 ESModule / CommonJS / CompiledWasm / Text / Data。
# wrangler 自带的默认规则里本来就有 {"type":"Text","globs":["**/*.txt","**/*.html"]}，
# 这里仍然显式写一遍：不依赖隐式默认（将来默认变了会报一个很难懂的错），
# 并加 fallthrough = true 让默认规则继续生效，否则 wrangler 会告警说默认规则被遮住。
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#bundling
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# 客户端脚本（src/archive.client.js）也作为文本模块引入，由 Worker 在 /_app/ 下当静态资源发出去。
# glob 必须以 `**/` 开头：规则是按**绝对路径**匹配的，写 "src/archive.client.js" 永远不命中
# （实测：规则不生效时 esbuild 会把它当普通 JS 模块加载，报 "No matching export ... default"）。
# 也不能写成 `**/*.js`：那会把 src/gateway.js 之类的真实 JS 源码一并变成文本模块。
[[rules]]
type = "Text"
globs = ["**/archive.client.js"]
fallthrough = true

[[r2_buckets]]
binding = "bucket" # <~ valid JavaScript variable name
bucket_name = "webdav"

# Environment variables (configured via `wrangler secret put`)
[vars]
# USERNAME = "set via Cloudflare Secrets"
# PASSWORD = "set via Cloudflare Secrets"

# Optional. Online editor page for the "open in ONLYOFFICE" action; needs SIGNING_SECRET.
# ONLYOFFICE_EDITOR_URL = "https://<editor-host>/editor"
# SIGNING_SECRET = "<oo-joint-test-secret>"
# ONLYOFFICE_EDITOR_URL = "https://YOUR-ZIYIYI-OFFICE.pages.dev/editor"
